<header class="app-header">
  <div class="lockup">
    <div class="logo-slot" id="logo-blip" data-brand="blip" title="Blip"></div>
    <span class="x" aria-hidden="true">×</span>
    <div class="logo-slot" id="logo-boost" data-brand="boost" title="Boost Mobile"></div>
  </div>
  <div class="hdr-controls">
    <div class="seg lang" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true"><svg class="i"><use href="#ic-globe"/></svg>EN</button>
      <button id="lang-pt" aria-pressed="false">PT</button>
    </div>
    <div class="seg" role="group" aria-label="Mode">
      <button id="mode-display" aria-pressed="true"><svg class="i"><use href="#ic-eye"/></svg><span data-t="display"></span></button>
      <button id="mode-edit" aria-pressed="false"><svg class="i"><use href="#ic-edit"/></svg><span data-t="edit"></span></button>
    </div>
    <button class="btn ghost sm" id="btn-versions"><svg class="i"><use href="#ic-history"/></svg><span data-t="versions"></span></button>
    <button class="btn ghost sm edit-only" id="btn-add"><svg class="i"><use href="#ic-plus"/></svg><span data-t="addInitiative"></span></button>
    <button class="btn sm edit-only" id="btn-save"><svg class="i"><use href="#ic-save"/></svg><span data-t="saveVersion"></span></button>
    <span class="save-indicator" id="save-indicator"></span>
    <button class="icon-btn" id="btn-logout" title="Sign out" aria-label="Sign out"><svg class="i"><use href="#ic-x"/></svg></button>
  </div>
</header>

<nav class="tabbar" role="tablist" id="tabbar"></nav>
<div id="banner-slot"></div>

<main>
  <div class="page" id="page-si">
    <section class="hero">
      <div class="hero-copy">
        <div class="kicker" id="h-kicker" data-meta="kicker"></div>
        <h1 id="h-title" data-meta="title"></h1>
        <p id="h-sub" data-meta="subtitle"></p>
      </div>
      <div class="fbox" id="fbox"></div>
    </section>
    <section class="section">
      <h2 class="section-title"><svg class="i"><use href="#ic-filter"/></svg><span data-t="mapTitle"></span></h2>
      <p class="section-lead" data-t="mapLead"></p>
      <div class="obj-edit edit-only" id="obj-edit"></div>
      <div class="funnel-map" id="funnel-map"></div>
    </section>
    <section class="section" id="detail-section">
      <button class="big-toggle" id="detail-toggle" aria-expanded="false">
        <span class="bt-ic"><svg class="i"><use href="#ic-list"/></svg></span>
        <span><span class="bt-t" data-t="detailTitle"></span><span class="bt-s" id="detail-sub"></span></span>
        <span class="bt-cta"><span id="detail-cta"></span><span class="chev"><svg class="i"><use href="#ic-chev"/></svg></span></span>
      </button>
      <div class="detail-wrap" id="detail-wrap">
        <div class="filters" id="filters"></div>
        <div class="cards" id="cards"></div>
      </div>
    </section>
    <section class="section">
      <h2 class="section-title"><svg class="i"><use href="#ic-flag"/></svg><span data-t="helpTitle"></span></h2>
      <p class="section-lead" data-t="helpLead"></p>
      <div class="board" id="board"></div>
    </section>
  </div>
  <div class="page" id="page-exec"></div>
  <div class="page" id="page-help"></div>
</main>
<footer><span id="foot-src"></span><span id="who"></span><span id="foot-ver"></span></footer>

<div class="drawer-back" id="drawer-back"></div>
<aside class="drawer" id="drawer" aria-label="Versions">
  <div class="drawer-head"><h3 data-t="versions"></h3><button class="icon-btn" id="drawer-close" aria-label="Close"><svg class="i"><use href="#ic-x"/></svg></button></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div id="toast-wrap"></div>

<div class="login-back" id="login"></div>
