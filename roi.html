<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boost Mobile — Marketing Investment ROI &amp; LTV Simulator</title>
<style>
/* ============================================================================
   CONFIG / DESIGN TOKENS  — Boost Dark Analytical Theme
   ========================================================================== */
:root{
  --bg-page:#111111;
  --bg-surface:#1C1C1C;
  --bg-surface-2:#181818;
  --bg-input:#141414;
  --border:#333333;
  --border-input:#444444;
  --text-primary:#FFFFFF;
  --text-secondary:#A0A0A0;
  --text-dim:#6E6E6E;
  --brand-orange:#FF5C00;
  --brand-orange-h:#FF7326;
  --brand-blue:#0084FF;
  --accent-cyan:#00D2FF;
  --status-negative:#E5484D;
  --status-positive:#30A46C;
  --status-warn:#F5A524;
  --radius:4px;
  --shadow:0 4px 6px rgba(0,0,0,.5);
  --sp:16px;
  --font:'Inter','Roboto','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page);color:var(--text-primary);
  font-family:var(--font);font-size:13px;line-height:1.2;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand-blue)}
::selection{background:var(--brand-orange);color:#fff}

/* --------------------------------- layout -------------------------------- */
.app-header{
  position:sticky;top:0;z-index:60;background:var(--bg-page);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:24px;padding:12px 24px;flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;gap:2px;min-width:230px}
.wordmark{font-size:19px;font-weight:800;letter-spacing:.12em;color:var(--brand-orange);text-transform:uppercase}
.wordmark span{color:var(--text-primary)}
.subtitle{font-size:11px;color:var(--text-secondary);letter-spacing:.04em}
.header-controls{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.header-field{display:flex;flex-direction:column;gap:3px}
.header-field>label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.save-indicator{font-size:10px;color:var(--text-dim);white-space:nowrap;max-width:190px}
.save-indicator.dirty{color:var(--status-warn)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--bg-page);
  position:sticky;top:64px;z-index:55;overflow-x:auto}
.tab-btn{
  display:inline-flex;align-items:center;gap:9px;
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;
  padding:12px 20px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-secondary);white-space:nowrap;
}
/* Flat monochrome tab glyphs: no gradients, no strokes, colour inherited from
   the tab state so they follow hover and the active orange automatically. */
.tab-btn svg{width:16px;height:16px;flex:none;fill:currentColor;opacity:.85}
.tab-btn[aria-selected="true"] svg{opacity:1}
@media (max-width:600px){ .tab-btn{gap:6px;padding:12px 12px} }
.tab-btn:hover{color:var(--text-primary)}
.tab-btn[aria-selected="true"]{color:var(--brand-orange);border-bottom-color:var(--brand-orange)}
.tab-panel{display:none;padding:20px 24px 64px}
.tab-panel.active{display:block}

.two-col{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.sticky-col{position:sticky;top:118px}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}
.col-4{grid-column:span 4}.col-3{grid-column:span 3}

/* ---------------------------------- cards -------------------------------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none}
.card-head.static{cursor:default}
.card-head h2,.card-head h3{
  font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-orange);
}
.card-head .chev{margin-left:auto;color:var(--text-secondary);font-size:11px;transition:transform .15s}
.card.collapsed .card-body{display:none}
.card.collapsed .chev{transform:rotate(-90deg)}
.card-body{padding:0 16px 16px}
.section-title{font-size:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-orange);margin:0 0 14px}
.hint{font-size:11px;color:var(--text-secondary);line-height:1.45}

/* --------------------------------- controls ------------------------------ */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field>label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
input[type=text],input[type=number],select,textarea{
  background:var(--bg-input);border:1px solid var(--border-input);border-radius:var(--radius);
  color:var(--text-primary);padding:7px 9px;width:100%;outline:none;
}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:52px;line-height:1.35}
input:focus,select:focus,textarea:focus{border-color:var(--brand-orange)}
input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
input[type=range]{width:100%;accent-color:var(--brand-orange);background:transparent}
input[type=checkbox]{accent-color:var(--brand-orange);width:14px;height:14px;cursor:pointer}
:focus-visible{outline:2px solid var(--brand-orange);outline-offset:1px}
.inline{display:flex;align-items:center;gap:8px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{
  background:var(--bg-input);border:1px solid var(--border-input);border-radius:var(--radius);
  color:var(--text-secondary);padding:4px 9px;font-size:10px;cursor:pointer;letter-spacing:.04em;
}
.chip:hover{border-color:var(--brand-orange);color:var(--text-primary)}
.chip.active{background:var(--brand-orange);border-color:var(--brand-orange);color:#fff;font-weight:700}

.btn{
  background:var(--brand-orange);border:1px solid var(--brand-orange);color:#fff;font-weight:700;
  border-radius:var(--radius);padding:8px 14px;cursor:pointer;font-size:12px;letter-spacing:.03em;
}
.btn:hover{background:var(--brand-orange-h);border-color:var(--brand-orange-h)}
.btn.secondary{background:transparent;border-color:var(--brand-blue);color:var(--brand-blue);font-weight:600}
.btn.secondary:hover{background:rgba(0,132,255,.12)}
.btn.ghost{background:transparent;border-color:var(--border-input);color:var(--text-secondary);font-weight:600}
.btn.ghost:hover{border-color:var(--text-secondary);color:var(--text-primary)}
.btn.danger{background:transparent;border-color:var(--status-negative);color:var(--status-negative);font-weight:600}
.btn.danger:hover{background:rgba(229,72,77,.14)}
.btn.sm{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:3px 5px;border-radius:3px;font-size:12px;line-height:1}
.icon-btn:hover{color:var(--text-primary);background:#262626}

.badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid}
.badge.default{color:var(--text-dim);border-color:var(--border)}
.badge.modified{color:var(--brand-orange);border-color:var(--brand-orange)}
.badge.invalid{color:var(--status-negative);border-color:var(--status-negative)}
.badge.legacy{color:var(--brand-blue);border-color:var(--brand-blue)}
.badge.assumption{color:var(--status-warn);border-color:var(--status-warn)}

/* ---------------------------------- tables ------------------------------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#202020}
tfoot td{font-weight:700;border-top:1px solid var(--border-input);border-bottom:none}
.table-wrap{overflow-x:auto}
table input[type=text],table input[type=number],table select{padding:5px 7px}

/* --------------------------------- KPI cards ----------------------------- */
.kpi-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kpi .k-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px}
.kpi .k-value{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.05;font-variant-numeric:tabular-nums;word-break:break-word}
.kpi .k-context{font-size:10px;color:var(--text-dim);margin-top:7px;line-height:1.35}
.kpi.hero .k-value{font-size:42px}
.pos{color:var(--status-positive)}.neg{color:var(--status-negative)}.orange{color:var(--brand-orange)}
.blue{color:var(--brand-blue)}.cyan{color:var(--accent-cyan)}.muted{color:var(--text-secondary)}

.live-panel .lp-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.live-panel .lp-row:last-child{border-bottom:none}
.live-panel .lp-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
.live-panel .lp-val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.live-panel .lp-val.big{font-size:30px;color:var(--brand-orange)}

/* ------------------------------ misc components -------------------------- */
.alert{border-radius:var(--radius);padding:9px 12px;font-size:11px;line-height:1.45;margin:8px 0;border:1px solid}
.alert.warn{border-color:var(--status-warn);color:#F7C97A;background:rgba(245,165,36,.08)}
.alert.err{border-color:var(--status-negative);color:#F2A0A2;background:rgba(229,72,77,.08)}
.alert.info{border-color:var(--border-input);color:var(--text-secondary);background:#161616}
.banner{position:sticky;top:118px;z-index:40;background:rgba(255,92,0,.12);border:1px solid var(--brand-orange);
  color:#FFB98C;padding:9px 12px;border-radius:var(--radius);font-size:11px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tip{position:relative;cursor:help;border-bottom:1px dotted var(--text-dim)}
.tip .tip-box{
  display:none;position:absolute;left:0;bottom:calc(100% + 6px);z-index:80;width:270px;
  background:#000;border:1px solid var(--border-input);border-radius:var(--radius);padding:9px 11px;
  font-size:11px;line-height:1.45;color:var(--text-secondary);box-shadow:var(--shadow);white-space:normal;font-weight:400;text-transform:none;letter-spacing:0
}
.tip:hover .tip-box,.tip:focus .tip-box,.tip:focus-within .tip-box{display:block}
.tip .tip-box code{color:var(--brand-orange);font-family:var(--mono);font-size:10.5px}
.help-dot{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;
  border:1px solid var(--text-dim);color:var(--text-dim);font-size:9px;font-weight:700;cursor:help}

#toast-wrap{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg-surface);border:1px solid var(--brand-orange);border-left-width:3px;border-radius:var(--radius);
  padding:10px 14px;font-size:12px;box-shadow:var(--shadow);max-width:330px;animation:slidein .18s ease-out}
.toast.err{border-color:var(--status-negative)}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:150;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--bg-surface);border:1px solid var(--border-input);border-radius:var(--radius);max-width:760px;width:100%;
  max-height:86vh;overflow:auto;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-surface)}
.modal-head h3{font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-orange)}
.modal-body{padding:18px}
.modal-body h4{color:var(--text-primary);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 7px}
.modal-body h4:first-child{margin-top:0}
.modal-body p,.modal-body li{font-size:12px;line-height:1.55;color:var(--text-secondary)}
.modal-body code{font-family:var(--mono);font-size:11px;color:var(--brand-orange);background:#0d0d0d;padding:1px 4px;border-radius:3px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--bg-surface)}

/* --------------------------------- formulas ------------------------------ */
.formula-card{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:12px}
.formula-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.formula-head .f-name{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.formula-head .f-target{font-family:var(--mono);font-size:11px;color:var(--accent-cyan)}
.expr{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius);padding:8px}
.expr select,.expr input{width:auto;padding:4px 6px;font-size:11px;background:#0e0e0e}
.expr select.op{color:var(--brand-orange);font-weight:700;min-width:52px;padding-right:20px}
.expr select.var{min-width:150px;padding-right:22px}
.expr input.const{width:88px;text-align:right;font-family:var(--mono)}
.term{display:inline-flex;align-items:center;gap:2px;background:#161616;border:1px solid var(--border);border-radius:3px;padding:2px}
.formula-foot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.preview-out{font-family:var(--mono);font-size:11px;color:var(--accent-cyan);margin-left:auto}
.changelog{max-height:420px;overflow:auto}
.changelog li{list-style:none;border-bottom:1px solid var(--border);padding:8px 0;font-size:11px;color:var(--text-secondary);line-height:1.45}
.changelog li b{color:var(--text-primary);font-weight:600}
.changelog li .ts{display:block;color:var(--text-dim);font-size:10px;margin-top:3px}
.changelog ul{margin:0;padding:0}

/* --------------------------------- charts -------------------------------- */
svg{display:block;max-width:100%;height:auto;overflow:visible}
.chart-wrap{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.chart-title{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-orange);margin-bottom:12px}
.chart-sub{font-size:11px;color:var(--text-secondary);margin:-8px 0 12px}
text{font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-secondary);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.matrix-pop{font-size:11px;color:var(--text-secondary)}

/* ------------------------------- comparison ------------------------------ */
.lens-switch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg-surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px}
.lens-switch .lens-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);font-weight:700}
.lens-note{font-size:11px;color:var(--text-secondary);margin:-6px 0 14px}
.lens-note b{color:var(--brand-orange)}
.ptax-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.ptax-grid{grid-template-columns:1fr}}
.scn-chip{display:inline-flex;align-items:center;gap:7px;background:var(--bg-input);border:1px solid var(--border-input);
  border-radius:var(--radius);padding:6px 10px;font-size:11px;cursor:pointer}
.scn-chip .dot{width:9px;height:9px;border-radius:2px;flex:none}
.scn-chip.on{border-color:var(--text-secondary);color:var(--text-primary)}
.scn-chip .base-tag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-orange);font-weight:700}
.delta-up{color:var(--status-positive)}.delta-down{color:var(--status-negative)}.delta-flat{color:var(--text-dim)}
.winner{border:1px solid var(--brand-orange);background:rgba(255,92,0,.07);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.winner .w-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-orange);margin-bottom:8px;font-weight:700}
.winner .w-text{font-size:15px;line-height:1.5}

/* -------------------------------- responsive ----------------------------- */
@media (max-width:1200px){
  .kpi-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .col-8,.col-6,.col-4,.col-3{grid-column:span 12}
}
@media (max-width:900px){
  .two-col{grid-template-columns:1fr}
  .sticky-col{position:static}
  .tabs{top:0;position:static}
  .app-header{position:static}
  .banner{top:0}
}
@media (max-width:560px){
  .kpi-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row-2,.row-3{grid-template-columns:1fr}
  .tab-panel{padding:14px 12px 48px}
  .app-header{padding:10px 12px}
  .header-controls{width:100%}
}

/* ---------------------------------- print -------------------------------- */
@media print{
  @page{size:landscape;margin:10mm}
  body{background:#fff;color:#000;font-size:10px}
  .app-header,.tabs,.no-print,#toast-wrap,.modal-backdrop{display:none !important}
  .tab-panel{display:none !important;padding:0}
  .tab-panel.active{display:block !important}
  .card,.kpi,.chart-wrap{background:#fff;border:1px solid #bbb;break-inside:avoid;page-break-inside:avoid}
  .section-title,.chart-title,.card-head h2,.card-head h3,.kpi .k-value.orange{color:#C24500 !important}
  .kpi .k-label,.hint,th,.k-context{color:#444 !important}
  .k-value{color:#000}
  .pos{color:#1d7a4d !important}.neg{color:#c0292e !important}
  th,td{border-bottom:1px solid #ccc}
  text{fill:#222}
  .sticky-col{position:static}
}
/* ---------- embedded in the Boost x Blip One Page ---------- */
html.embed .app-header .brand,html.embed .lang-field{display:none}
html.embed .app-header{padding:8px 16px;gap:12px}
html.embed .tabs{top:52px}
html.embed .save-indicator{max-width:260px}
</style>
</head>
<body>

<header class="app-header no-print">
  <div class="brand">
    <div class="wordmark">Boost <span>Mobile</span></div>
    <div class="subtitle" data-i18n="app.subtitle">Marketing Investment ROI &amp; LTV Simulator</div>
  </div>
  <div class="header-controls">
    <div class="header-field lang-field">
      <label for="hdr-lang" data-i18n="hdr.language">Language</label>
      <select id="hdr-lang" aria-label="Language">
        <option value="en">EN</option><option value="pt">PT-BR</option><option value="es">ES</option>
      </select>
    </div>
    <div class="header-field">
      <label for="hdr-currency" data-i18n="hdr.currency">Display currency</label>
      <select id="hdr-currency" aria-label="Display currency"></select>
    </div>
    <div class="btn-row" style="align-items:flex-end">
      <button class="btn ghost sm" id="btn-export-json" data-i18n="hdr.exportJson">Export JSON</button>
      <button class="btn ghost sm" id="btn-import-json" data-i18n="hdr.importJson">Import JSON</button>
      <button class="btn ghost sm" id="btn-methodology" data-i18n="hdr.methodology">Methodology</button>
    </div>
    <div class="save-indicator" id="save-indicator"></div>
  </div>
</header>

const METHODOLOGY = {
en:`<h4>Scope of the model</h4>
<p>This simulator turns a five-stage conversational marketing funnel plus a final conversion rate into contracted plans, and converts those plans into lifetime revenue, gross profit, and return on the media investment. Every displayed number is derived from the Variable Registry through a formula that is visible and editable in the <b>Formula Configuration</b> tab.</p>
<h4>Retention and churn</h4>
<p><code>Retention (months) = 1 / Monthly churn</code>. The two fields are linked: editing one recalculates the other. Presets follow the prepaid/MVNO churn range of 4%–6% per month found in the source research: optimistic 4.00% (25 months), realistic 4.55% (22 months), pessimistic 6.25% (16 months).</p>
<h4>Where this model stops: revenue</h4>
<p><b>Revenue ROI</b> measures the return against gross lifetime revenue: <code>(Total gross revenue LTV &minus; Total investment) / Total investment</code>. <b>ROAS</b> is the same relationship as a multiple. Both answer one question: how much lifetime top-line did this media buy?</p>
<p><b>These are not profitability measures.</b> They do not deduct the cost of serving the customer &mdash; network or wholesale access, customer care, billing, bad debt, overhead. A campaign can show a healthy ROAS and still lose money once those costs are applied. This tool deliberately stops at revenue, so any margin or profit conclusion has to be made outside it, with the finance team's own cost base. Presenting a revenue ROI as a profit result would misstate the case.</p>
<p>The margin-based ROI family that earlier versions carried was removed, together with its gross-profit, contribution and break-even-margin metrics, so that no number on screen can be mistaken for a bottom-line figure.</p>
<p><b>LTV:CAC</b> is the sharpest margin-free check that remains, and it is worth reading before ROAS. It compares lifetime revenue per customer against what was paid to acquire that customer; below 1.0 the campaign does not even recover its media out of gross revenue, before any cost of service.</p>
<h4>Data-quality note on the source workbook</h4>
<p>In the workbook's <code>Conversion &amp; LTV &amp; ROI</code> sheet, the <code>ROI (%)</code> column headers of the margin table repeat the LTV-in-months labels where they should repeat the margin labels. That table is no longer reproduced here, but the note is kept for traceability against the original file.</p>
<h4>Rounding of contracted plans</h4>
<p>The workbook rounds conversions to whole customers before computing revenue. That setting is on by default and reproduces the published figures exactly (e.g. 263 × 60% → 158 plans → $139,040 gross revenue LTV → −$1,920 ROI). Turning it off yields fractional plans (157.8) and a marginally different ROI. Neither is wrong; the choice is disclosed rather than hidden.</p>
<h4>Negative values and division by zero</h4>
<p>Negative results are displayed as real negative numbers with a negative status colour. The workbook's "Loss" convention is available as a display toggle. Where a denominator is zero — no investment, no traffic — the metric returns <code>n/a</code> rather than infinity or NaN.</p>
<h4>Benchmarks used as tooltips</h4>
<p>Prepaid/MVNO monthly churn 4%–6%; weighted average ticket for the Boost plan mix ≈ US$ 40.08 (Unlimited $25, Global Connection $40, Unlimited Plus $50, Unlimited Premium $60, with AutoPay). These come from the source workbook's research tab and are shown as informative ranges, not as guarantees.</p>
<h4>Currency</h4>
<p>All calculations are performed in USD. The display-currency selector converts at the configured FX rate for presentation only; the underlying model never changes unit.</p>`,
pt:`<h4>Escopo do modelo</h4>
<p>Este simulador transforma um funil de marketing conversacional de cinco etapas mais uma taxa de convers\u00E3o final em planos contratados, e converte esses planos em receita de ciclo de vida, lucro bruto e retorno sobre o investimento em m\u00EDdia. Todo n\u00FAmero exibido vem do Registro de Vari\u00E1veis por uma f\u00F3rmula vis\u00EDvel e edit\u00E1vel na aba <b>Configura\u00E7\u00E3o de f\u00F3rmulas</b>.</p>
<h4>Reten\u00E7\u00E3o e churn</h4>
<p><code>Reten\u00E7\u00E3o (meses) = 1 / Churn mensal</code>. Os dois campos s\u00E3o ligados: editar um recalcula o outro. Os presets seguem a faixa de churn pr\u00E9-pago/MVNO de 4%\u20136% ao m\u00EAs da pesquisa de origem: otimista 4,00% (25 meses), realista 4,55% (22 meses), pessimista 6,25% (16 meses).</p>
<h4>Onde este modelo para: na receita</h4>
<p><b>ROI sobre receita</b> mede o retorno contra a receita bruta de ciclo de vida: <code>(Receita bruta LTV total &minus; Investimento total) / Investimento total</code>. O <b>ROAS</b> \u00E9 a mesma rela\u00E7\u00E3o expressa como m\u00FAltiplo. Ambos respondem a uma \u00FAnica pergunta: quanto de topo de linha de ciclo de vida esta m\u00EDdia comprou?</p>
<p><b>Estas n\u00E3o s\u00E3o medidas de lucratividade.</b> Elas n\u00E3o deduzem o custo de servir o cliente &mdash; acesso de rede ou wholesale, atendimento, billing, inadimpl\u00EAncia, overhead. Uma campanha pode exibir um ROAS saud\u00E1vel e ainda assim dar preju\u00EDzo quando esses custos entram. A ferramenta para deliberadamente na receita, ent\u00E3o qualquer conclus\u00E3o de margem ou lucro precisa ser feita fora dela, com a base de custos do financeiro. Apresentar um ROI de receita como resultado de lucro seria distorcer o caso.</p>
<p>A fam\u00EDlia de ROI baseada em margem que as vers\u00F5es anteriores carregavam foi removida, junto com as m\u00E9tricas de lucro bruto, contribui\u00E7\u00E3o e margem de break-even, para que nenhum n\u00FAmero na tela possa ser confundido com resultado de bottom line.</p>
<p><b>LTV:CAC</b> \u00E9 a checagem mais afiada que resta sem depender de margem, e vale ler antes do ROAS. Compara a receita de ciclo de vida por cliente com o que foi pago para adquiri-lo; abaixo de 1,0 a campanha n\u00E3o recupera nem a m\u00EDdia a partir da receita bruta, antes de qualquer custo de servi\u00E7o.</p>
<h4>Nota de qualidade de dados da planilha</h4>
<p>Na aba <code>Conversion &amp; LTV &amp; ROI</code>, os cabe\u00E7alhos das colunas de <code>ROI (%)</code> da tabela de margem repetem os r\u00F3tulos de LTV em meses quando deveriam repetir os r\u00F3tulos de margem. Essa tabela n\u00E3o \u00E9 mais reproduzida aqui, mas a nota fica registrada para rastreabilidade contra o arquivo original.</p>
<h4>Arredondamento dos planos contratados</h4>
<p>A planilha arredonda as convers\u00F5es para clientes inteiros antes de calcular receita. Esse ajuste vem ligado por padr\u00E3o e reproduz exatamente os n\u00FAmeros publicados (ex.: 263 \u00D7 60% \u2192 158 planos \u2192 US$ 139.040 de receita bruta LTV \u2192 \u2212US$ 1.920 de ROI). Desligado, produz planos fracion\u00E1rios (157,8) e um ROI marginalmente diferente. Nenhum dos dois est\u00E1 errado; a escolha \u00E9 declarada em vez de escondida.</p>
<h4>Valores negativos e divis\u00E3o por zero</h4>
<p>Resultados negativos aparecem como n\u00FAmeros negativos reais, com a cor de status negativa. A conven\u00E7\u00E3o "Preju\u00EDzo" da planilha existe como toggle de exibi\u00E7\u00E3o. Quando um denominador \u00E9 zero \u2014 sem investimento, sem tr\u00E1fego \u2014 a m\u00E9trica retorna <code>n/d</code>, nunca infinito ou NaN.</p>
<h4>Benchmarks usados como tooltips</h4>
<p>Churn mensal pr\u00E9-pago/MVNO 4%\u20136%; ticket m\u00E9dio ponderado do mix Boost \u2248 US$ 40,08 (Unlimited $25, Global Connection $40, Unlimited Plus $50, Unlimited Premium $60, com AutoPay). V\u00EAm da aba de pesquisa da planilha e s\u00E3o exibidos como faixas informativas, n\u00E3o como garantias.</p>
<h4>Moeda</h4>
<p>Todos os c\u00E1lculos s\u00E3o feitos em USD. O seletor de moeda de exibi\u00E7\u00E3o converte pela taxa configurada apenas para apresenta\u00E7\u00E3o; o modelo subjacente nunca muda de unidade.</p>`,
es:`<h4>Alcance del modelo</h4>
<p>Este simulador convierte un embudo de marketing conversacional de cinco etapas m\u00E1s una tasa de conversi\u00F3n final en planes contratados, y transforma esos planes en ingresos de ciclo de vida, utilidad bruta y retorno sobre la inversi\u00F3n en medios. Cada n\u00FAmero mostrado proviene del Registro de Variables mediante una f\u00F3rmula visible y editable en la pesta\u00F1a <b>Configuraci\u00F3n de f\u00F3rmulas</b>.</p>
<h4>Retenci\u00F3n y churn</h4>
<p><code>Retenci\u00F3n (meses) = 1 / Churn mensual</code>. Ambos campos est\u00E1n ligados: editar uno recalcula el otro. Los presets siguen el rango de churn prepago/MVNO de 4%\u20136% mensual de la investigaci\u00F3n original: optimista 4,00% (25 meses), realista 4,55% (22 meses), pesimista 6,25% (16 meses).</p>
<h4>D\u00F3nde se detiene este modelo: en el ingreso</h4>
<p><b>ROI sobre ingresos</b> mide el retorno contra el ingreso bruto de ciclo de vida: <code>(Ingreso bruto LTV total &minus; Inversi\u00F3n total) / Inversi\u00F3n total</code>. El <b>ROAS</b> es la misma relaci\u00F3n expresada como m\u00FAltiplo. Ambos responden una sola pregunta: cu\u00E1nto tope de l\u00EDnea de ciclo de vida compraron estos medios.</p>
<p><b>No son medidas de rentabilidad.</b> No deducen el costo de servir al cliente &mdash; acceso de red o mayorista, atenci\u00F3n, facturaci\u00F3n, incobrables, overhead. Una campa\u00F1a puede mostrar un ROAS saludable y aun as\u00ED perder dinero al aplicar esos costos. La herramienta se detiene deliberadamente en el ingreso, por lo que cualquier conclusi\u00F3n de margen o utilidad debe hacerse fuera de ella, con la base de costos del \u00E1rea financiera. Presentar un ROI de ingresos como resultado de utilidad ser\u00EDa tergiversar el caso.</p>
<p>La familia de ROI basada en margen que ten\u00EDan las versiones anteriores fue eliminada, junto con las m\u00E9tricas de utilidad bruta, contribuci\u00F3n y margen de equilibrio, para que ning\u00FAn n\u00FAmero en pantalla pueda confundirse con una cifra de bottom line.</p>
<p><b>LTV:CAC</b> es la verificaci\u00F3n m\u00E1s n\u00EDtida que queda sin depender del margen, y conviene leerla antes del ROAS. Compara el ingreso de ciclo de vida por cliente con lo que se pag\u00F3 por adquirirlo; por debajo de 1,0 la campa\u00F1a ni siquiera recupera los medios desde el ingreso bruto, antes de cualquier costo de servicio.</p>
<h4>Nota de calidad de datos de la hoja original</h4>
<p>En la hoja <code>Conversion &amp; LTV &amp; ROI</code>, los encabezados de las columnas de <code>ROI (%)</code> de la tabla de margen repiten las etiquetas de LTV en meses donde deber\u00EDan repetir las de margen. Esa tabla ya no se reproduce aqu\u00ED, pero la nota se conserva para trazabilidad contra el archivo original.</p>
<h4>Redondeo de planes contratados</h4>
<p>La hoja redondea las conversiones a clientes enteros antes de calcular ingresos. Ese ajuste viene activado y reproduce exactamente las cifras publicadas (p. ej. 263 \u00D7 60% \u2192 158 planes \u2192 US$ 139.040 de ingreso bruto LTV \u2192 \u2212US$ 1.920 de ROI). Desactivado, produce planes fraccionarios (157,8) y un ROI levemente distinto. Ninguno es incorrecto; la elecci\u00F3n se declara en lugar de ocultarse.</p>
<h4>Valores negativos y divisi\u00F3n por cero</h4>
<p>Los resultados negativos se muestran como n\u00FAmeros negativos reales con el color de estado negativo. La convenci\u00F3n "P\u00E9rdida" de la hoja existe como interruptor de visualizaci\u00F3n. Cuando un denominador es cero \u2014 sin inversi\u00F3n, sin tr\u00E1fico \u2014 la m\u00E9trica devuelve <code>n/d</code>, nunca infinito ni NaN.</p>
<h4>Benchmarks usados como tooltips</h4>
<p>Churn mensual prepago/MVNO 4%\u20136%; margen bruto MVNO 15%\u201335%, con 20%\u201325% como base segura de planeaci\u00F3n; margen EBITDA 5%\u201315%; ticket promedio ponderado del mix Boost \u2248 US$ 40,08 (Unlimited $25, Global Connection $40, Unlimited Plus $50, Unlimited Premium $60, con AutoPay). Provienen de la pesta\u00F1a de investigaci\u00F3n de la hoja y se muestran como rangos informativos, no como garant\u00EDas.</p>
<h4>Moneda</h4>
<p>Todos los c\u00E1lculos se realizan en USD. El selector de moneda convierte a la tasa configurada solo para presentaci\u00F3n; el modelo subyacente nunca cambia de unidad.</p>`
};

  { key:'revenue',    label:{en:'Revenue & LTV', pt:'Receita e LTV', es:'Ingresos y LTV'} },
  { key:'efficiency', label:{en:'Efficiency', pt:'Efici\u00EAncia', es:'Eficiencia'} },
  { key:'roi',        label:{en:'ROI', pt:'ROI', es:'ROI'} },
  { key:'breakeven',  label:{en:'Break-even', pt:'Break-even', es:'Break-even'} }
];

/* ============================================================================
   FORMULA_ENGINE — tokenise -> validate -> shunting-yard -> RPN evaluate.
   No eval(), no new Function(). Everything runs on the token array.
   ========================================================================== */
const FormulaEngine = (function(){

  const PREC = { '+':1, '-':1, '*':2, '/':2, '%':2, 'u-':3, '^':4 };
  const RIGHT_ASSOC = { '^':true, 'u-':true };

  function cloneTokens(tokens){
    return tokens.map(function(t){ return { t:t.t, v:t.v }; });
  }

  /* ---- structural validation ------------------------------------------- */
  // Returns {ok:true} or {ok:false, code:'syntax'|'unknown_var', index:n}
  function validate(tokens){
    if(!Array.isArray(tokens) || tokens.length === 0) return { ok:false, code:'syntax', index:0 };
    let depth = 0, expectOperand = true;
    for(let i = 0; i < tokens.length; i++){
      const tk = tokens[i];
      if(tk.t === 'var'){
        if(!expectOperand) return { ok:false, code:'syntax', index:i+1 };
        if(!VAR_BY_ID[tk.v]) return { ok:false, code:'unknown_var', index:i+1 };
        expectOperand = false;
      } else if(tk.t === 'num'){
        if(!expectOperand) return { ok:false, code:'syntax', index:i+1 };
        if(typeof tk.v !== 'number' || !isFinite(tk.v)) return { ok:false, code:'syntax', index:i+1 };
        expectOperand = false;
      } else if(tk.t === 'op'){
        if(tk.v === '('){
          if(!expectOperand) return { ok:false, code:'syntax', index:i+1 };
          depth++;
        } else if(tk.v === ')'){
          if(expectOperand) return { ok:false, code:'syntax', index:i+1 };
          depth--;
          if(depth < 0) return { ok:false, code:'syntax', index:i+1 };
        } else if(OPERATORS.indexOf(tk.v) >= 0){
          if(expectOperand){
            // only a leading minus is allowed as unary
            if(tk.v !== '-') return { ok:false, code:'syntax', index:i+1 };
          } else {
            expectOperand = true;
          }
        } else {
          return { ok:false, code:'syntax', index:i+1 };
        }
      } else {
        return { ok:false, code:'syntax', index:i+1 };
      }
    }
    if(expectOperand) return { ok:false, code:'syntax', index:tokens.length };
    if(depth !== 0) return { ok:false, code:'syntax', index:tokens.length };
    return { ok:true };
  }

  /* ---- shunting-yard ---------------------------------------------------- */
  function toRPN(tokens){
    const out = [], stack = [];
    let expectOperand = true;
    for(let i = 0; i < tokens.length; i++){
      const tk = tokens[i];
      if(tk.t === 'var' || tk.t === 'num'){
        out.push(tk); expectOperand = false;
      } else if(tk.v === '('){
        stack.push('('); expectOperand = true;
      } else if(tk.v === ')'){
        while(stack.length && stack[stack.length-1] !== '(') out.push({ t:'op', v:stack.pop() });
        stack.pop();
        expectOperand = false;
      } else {
        let op = tk.v;
        if(expectOperand && op === '-') op = 'u-';
        while(stack.length){
          const top = stack[stack.length-1];
          if(top === '(') break;
          const higher = PREC[top] > PREC[op];
          const equalLeft = PREC[top] === PREC[op] && !RIGHT_ASSOC[op];
          if(higher || equalLeft) out.push({ t:'op', v:stack.pop() }); else break;
        }
        stack.push(op);
        expectOperand = true;
      }
    }
    while(stack.length) out.push({ t:'op', v:stack.pop() });
    return out;
  }

  /* ---- evaluation ------------------------------------------------------- */
  // ctx: {varId: number|null}. Returns a finite number, or null when the result
  // is undefined (division by zero, missing input, complex root...).
  function evaluateRPN(rpn, ctx){
    const st = [];
    for(let i = 0; i < rpn.length; i++){
      const tk = rpn[i];
      if(tk.t === 'num'){ st.push(tk.v); continue; }
      if(tk.t === 'var'){
        const val = ctx[tk.v];
        st.push((typeof val === 'number' && isFinite(val)) ? val : null);
        continue;
      }
      if(tk.v === 'u-'){
        const a = st.pop();
        st.push(a === null ? null : -a);
        continue;
      }
      const b = st.pop(), a = st.pop();
      if(a === null || b === null || a === undefined || b === undefined){ st.push(null); continue; }
      let r;
      switch(tk.v){
        case '+': r = a + b; break;
        case '-': r = a - b; break;
        case '*': r = a * b; break;
        case '/': r = (b === 0) ? null : a / b; break;
        case '%': r = (b === 0) ? null : a % b; break;
        case '^': r = Math.pow(a, b); break;
        default:  r = null;
      }
      if(r !== null && !isFinite(r)) r = null;
      st.push(r);
    }
    const res = st.pop();
    return (typeof res === 'number' && isFinite(res)) ? res : null;
  }

  function dependencies(tokens){
    const s = [];
    tokens.forEach(function(t){ if(t.t === 'var' && s.indexOf(t.v) < 0) s.push(t.v); });
    return s;
  }

  /* ---- dependency ordering (Kahn) --------------------------------------- */
  // formulaSet: {formulaId: tokens}. Returns {order:[formulaId...], cycle:null}
  // or {order:null, cycle:{formulaId, via}}.
  function resolveOrder(formulaSet){
    const targets = {};                    // varId -> formulaId
    Object.keys(formulaSet).forEach(function(fid){
      targets[FORMULA_BY_ID[fid].target] = fid;
    });
    const deps = {}, indeg = {}, dependents = {};
    Object.keys(formulaSet).forEach(function(fid){
      deps[fid] = dependencies(formulaSet[fid]).map(function(v){ return targets[v]; })
                    .filter(function(x){ return !!x; });
      indeg[fid] = 0;
    });
    Object.keys(deps).forEach(function(fid){
      deps[fid].forEach(function(d){
        indeg[fid]++;
        (dependents[d] = dependents[d] || []).push(fid);
      });
    });
    const queue = Object.keys(indeg).filter(function(f){ return indeg[f] === 0; }).sort();
    const order = [];
    while(queue.length){
      const f = queue.shift();
      order.push(f);
      (dependents[f] || []).forEach(function(n){
        indeg[n]--; if(indeg[n] === 0) queue.push(n);
      });
    }
    if(order.length !== Object.keys(formulaSet).length){
      const stuck = Object.keys(indeg).filter(function(f){ return order.indexOf(f) < 0; });
      const fid = stuck[0];
      const via = deps[fid].filter(function(d){ return stuck.indexOf(d) >= 0; })[0] || fid;
      return { order:null, cycle:{ formulaId: fid, via: FORMULA_BY_ID[via].target } };
    }
    return { order: order, cycle: null };
  }

  /* ---- pretty printing --------------------------------------------------- */
  function toText(tokens, lang, useSymbols){
    return tokens.map(function(tk){
      if(tk.t === 'num') return String(tk.v);
      if(tk.t === 'op')  return OP_LABEL[tk.v] || tk.v;
      const v = VAR_BY_ID[tk.v];
      if(!v) return '?';
      return useSymbols ? v.symbol : v.label[lang];
    }).join(' ').replace(/\(\s/g,'(').replace(/\s\)/g,')');
  }

  return {
    validate: validate,
    toRPN: toRPN,
    evaluateRPN: evaluateRPN,
    dependencies: dependencies,
    resolveOrder: resolveOrder,
    toText: toText,
    clone: cloneTokens
  };
})();
/* ============================================================================
   STATE
   ========================================================================== */
let STATE = null;
let STORAGE_OK = true;
let DIRTY = false;          // unsaved scenario edits
let DRAFT = null;           // working copy of the active scenario
let FORMULA_DRAFT = null;   // working copy of formulas (formula tab)
let FORMULA_DIRTY = false;
let CALC_CACHE = {};        // scenarioId -> computed result
let EVAL_ORDER = [];        // resolved formula evaluation order

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function nowISO(){ return new Date().toISOString(); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---- seed scenarios (from the source workbook) -------------------------- */

/* Funnel signatures of superseded seed data (schema v1, W1-W10 basis). Used to
   refresh untouched default scenarios when an older workspace is loaded. */
const LEGACY_SEED_SIGNATURES = [
  [ { s1: 16765, s5: 658, cost: 352400 }, { s1: 6706, s5: 263, cost: 140960 } ],
  [ { s1: 13980, s5: 549, cost: 101000 }, { s1: 5592, s5: 220, cost: 40400 } ]
];
function refreshLegacySeeds(list){
  const seeds = seedScenarios();
  return list.map(function(sc){
    for(var i = 0; i < LEGACY_SEED_SIGNATURES.length; i++){
      const inp = sc.inputs || {};
      const sig = LEGACY_SEED_SIGNATURES[i].filter(function(g){
        return Math.round(num(inp.funnel_s1_unique_users, -1)) === g.s1 &&
               Math.round(num(inp.funnel_s5_clicked_external, -1)) === g.s5;
      })[0];
      if(!sig) continue;
      const seed = seeds[i];
      const out = deepClone(sc);
      out.name = seed.name;
      out.description = seed.description;
      CONFIG.FUNNEL_STAGES.forEach(function(k){ out.inputs[k] = seed.inputs[k]; });
      const seedAmount = seed.costLines[0].amount;
      out.costLines = (out.costLines || []).map(function(c){
        return (Math.round(num(c.amount, 0)) === sig.cost) ? Object.assign({}, c, { amount: seedAmount }) : c;
      });
      if(!out.costLines.length) out.costLines = deepClone(seed.costLines);
      out.updatedAt = nowISO();
      return out;
    }
    return sc;
  });
}

function defaultPresets(){
  return {
    cvr: CONFIG.CVR_PRESETS.map(function(p){ return { key: p.key, v: p.v }; }),
    retention: CONFIG.RETENTION_PRESETS.map(function(p){ return { key: p.key, months: p.months, churn: p.churn }; })
  };
}
/* Live preset accessors — always used by render, events and the family generator. */
function cvrPresets(){
  const p = STATE && STATE.settings && STATE.settings.presets;
  return (p && Array.isArray(p.cvr) && p.cvr.length) ? p.cvr : defaultPresets().cvr;
}
function retPresets(){
  const p = STATE && STATE.settings && STATE.settings.presets;
  return (p && Array.isArray(p.retention) && p.retention.length) ? p.retention : defaultPresets().retention;
}

function defaultFormulas(){
  const f = {};
  FORMULA_DEFS.forEach(function(d){ f[d.id] = { tokens: FormulaEngine.clone(d.tokens), modified: false }; });
  return f;
}

function defaultState(){
  const scns = seedScenarios();
  return {
    version: CONFIG.SCHEMA_VERSION,
    lang: 'en',
    activeTab: 'builder',
    activeScenarioId: scns[0].id,
    scenarios: scns,
    formulas: defaultFormulas(),
    settings: {

      roundContracted: true,
      currency: 'USD',

      presets: defaultPresets(),
      /* Global conversion lens applied to Scenario View and Scenario Comparison.
         'scenario' = use each scenario's own final conversion rate. */
      conversionLens: 'scenario'
    },
    comparison: { ids: [], baselineId: null, normalized: false },

  };
}

/* ============================================================================
   PERSISTENCE
   ========================================================================== */
function saveState(){
  STATE.savedAt = nowISO();
  if(EMBED){
    embedUiSave();
    const sh = JSON.stringify(embedShared());
    if(sh !== EMBED_LAST){
      EMBED_LAST = sh;
      if(EMBED_RO) toast(t('save.embedRO'), true);
      else embedPost({ type:'roi:state', state: JSON.parse(sh) });
    }
    renderSaveIndicator();
    return;
  }
  if(!STORAGE_OK) { renderSaveIndicator(); return; }
  try {
    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(STATE));
  } catch(e){
    STORAGE_OK = false;
    toast(t('err.storage'), true);
  }
  renderSaveIndicator();
}

function loadState(){
  let raw = null;
  try { raw = localStorage.getItem(CONFIG.STORAGE_KEY); }
  catch(e){ STORAGE_OK = false; }
  if(!raw) return defaultState();
  let parsed;
  try { parsed = JSON.parse(raw); } catch(e){ return defaultState(); }
  return migrate(parsed);
}

function migrate(s){
  const base = defaultState();
  if(!s || typeof s !== 'object') return base;
  // Forward-compatible merge: unknown/missing keys fall back to defaults.
  const out = Object.assign({}, base, s);
  out.version = CONFIG.SCHEMA_VERSION;
  out.settings = Object.assign({}, base.settings, s.settings || {});
  out.settings.fxRates = Object.assign({}, base.settings.fxRates, (s.settings && s.settings.fxRates) || {});
  out.settings.presets = sanitizePresets((s.settings && s.settings.presets) || null);
  // v3 used a 'scenario' lens option; conversion is global from v4 onwards.
  if(out.settings.conversionLens === 'scenario') out.settings.conversionLens = 'realistic';
  out.comparison = Object.assign({}, base.comparison, s.comparison || {});
  // formulas: keep only known ids, add missing ones from defaults
  const f = {};
  FORMULA_DEFS.forEach(function(d){
    const stored = s.formulas && s.formulas[d.id];
    f[d.id] = (stored && Array.isArray(stored.tokens) && stored.tokens.length)
      ? { tokens: stored.tokens, modified: !!stored.modified }
      : { tokens: FormulaEngine.clone(d.tokens), modified: false };
  });
  out.formulas = f;
  if(!Array.isArray(out.scenarios) || !out.scenarios.length) out.scenarios = base.scenarios;
  out.scenarios = out.scenarios.map(normalizeScenario);
  // v1 -> v2: seed funnel data moved to the workbook's monthly-average basis.
  if(num(s.version, 1) < 3) out.scenarios = refreshLegacySeeds(out.scenarios);
  // v4 -> v5: the margin field was redefined from gross margin to contribution
  // margin before acquisition marketing, so the old 25% default is restated.
  // v6: the gross-profit family was removed; the model stops at revenue ROI.
  if(num(s.version, 1) < 6){
    out.scenarios.forEach(function(sc){ delete sc.inputs.gross_margin_pct; });
    if(out.settings.presets) delete out.settings.presets.margin;
  }
  if(num(s.version, 1) !== CONFIG.SCHEMA_VERSION) MIGRATED = true;
  if(!out.scenarios.some(function(x){ return x.id === out.activeScenarioId; })) out.activeScenarioId = out.scenarios[0].id;
  if(!Array.isArray(out.changelog)) out.changelog = [];
  return out;
}

function sanitizePresets(p){
  const d = defaultPresets();
  if(!p || typeof p !== 'object') return d;
  const out = deepClone(d);
  if(Array.isArray(p.cvr)) out.cvr = out.cvr.map(function(def, i){
    const v = p.cvr[i] ? num(p.cvr[i].v, def.v) : def.v;
    return { key: def.key, v: (v >= 0 && v <= 1) ? v : def.v };
  });
  if(Array.isArray(p.retention)) out.retention = out.retention.map(function(def, i){
    const m = p.retention[i] ? num(p.retention[i].months, def.months) : def.months;
    const months = (m > 0 && m <= 600) ? m : def.months;
    return { key: def.key, months: months, churn: 1 / months };
  });
  return out;
}

function normalizeScenario(s){
  const d = seedScenarios()[0];
  const o = {
    id: s.id || uid('scn'),
    name: typeof s.name === 'string' ? s.name : 'Scenario',
    description: typeof s.description === 'string' ? s.description : '',
    createdAt: s.createdAt || nowISO(),
    updatedAt: s.updatedAt || nowISO(),
    tags: Array.isArray(s.tags) ? s.tags.filter(function(x){ return typeof x === 'string'; }) : [],
    locked: !!s.locked,
    inputs: Object.assign({}, d.inputs, s.inputs || {}),
    costLines: Array.isArray(s.costLines) ? s.costLines.map(function(c){
      return {
        id: c.id || uid('cost'),
        label: typeof c.label === 'string' ? c.label : 'Cost',
        category: CONFIG.COST_CATEGORIES.indexOf(c.category) >= 0 ? c.category : 'Other',
        amount: num(c.amount, 0),
        includeInROI: c.includeInROI !== false
      };
    }) : []
  };
  // The final conversion rate is global (see CONVERSION SPECTRUM). Any value
  // stored by an older schema is dropped rather than silently kept per object.
  delete o.inputs.final_conversion_rate;
  // v6: the model stops at revenue ROI, so no margin is stored on a scenario.
  delete o.inputs.gross_margin_pct;
  Object.keys(o.inputs).forEach(function(k){ o.inputs[k] = num(o.inputs[k], d.inputs[k] || 0); });
  return o;
}

/* ============================================================================
   CALC
   ========================================================================== */
function num(v, fallback){
  const n = typeof v === 'string' ? parseFloat(v) : v;
  return (typeof n === 'number' && isFinite(n)) ? n : (fallback === undefined ? 0 : fallback);
}

function totalInvestment(scn){
  return scn.costLines.reduce(function(a, c){ return a + (c.includeInROI ? num(c.amount, 0) : 0); }, 0);
}

function rebuildEvalOrder(formulas){
  const set = {};
  Object.keys(formulas).forEach(function(fid){ set[fid] = formulas[fid].tokens; });
  const res = FormulaEngine.resolveOrder(set);
  if(res.order){
    EVAL_ORDER = res.order;
    // Pre-compile RPN for speed.
    EVAL_ORDER.forEach(function(fid){ formulas[fid]._rpn = FormulaEngine.toRPN(formulas[fid].tokens); });
  }
  return res;
}

/* Full computation of one scenario. `overrides` patches inputs for sweeps. */
function computeScenario(scn, overrides){
  const ctx = {};
  Object.keys(scn.inputs).forEach(function(k){ ctx[k] = num(scn.inputs[k], 0); });
  // Global, never per-scenario: see CONVERSION SPECTRUM.
  ctx.final_conversion_rate = activeCvr();
  if(overrides) Object.keys(overrides).forEach(function(k){ ctx[k] = overrides[k]; });
  ctx.total_investment = (overrides && overrides.total_investment !== undefined)
    ? overrides.total_investment : totalInvestment(scn);

  const F = STATE.formulas;
  for(let i = 0; i < EVAL_ORDER.length; i++){
    const fid = EVAL_ORDER[i];
    const def = FORMULA_BY_ID[fid];
    const rpn = F[fid]._rpn || (F[fid]._rpn = FormulaEngine.toRPN(F[fid].tokens));
    let val = FormulaEngine.evaluateRPN(rpn, ctx);
    if(fid === 'CONTRACTED_PLANS' && val !== null && STATE.settings.roundContracted) val = Math.round(val);
    ctx[def.target] = val;
  }

  /* ---- funnel table (procedural, not formula-driven) -------------------- */
  const stages = CONFIG.FUNNEL_STAGES.map(function(id){ return { id: id, value: num(ctx[id], 0) }; });
  const s6 = ctx.s6_contracted_plans;
  const all = stages.concat([{ id: 's6_contracted_plans', value: (s6 === null ? 0 : s6), derived: true }]);
  const inv = ctx.total_investment;
  const rows = all.map(function(st, i){
    const prev = i > 0 ? all[i-1].value : null;
    const stepConv  = (i === 0 || !prev) ? null : st.value / prev;
    const dropAbs   = (i === 0 || prev === null) ? null : prev - st.value;
    const dropRate  = (i === 0 || !prev) ? null : 1 - (st.value / prev);
    const cumulative = all[0].value ? st.value / all[0].value : null;
    const cpa = st.value ? inv / st.value : null;
    const vsPrev = [];
    for(let j = 0; j < i; j++){
      vsPrev.push({ id: all[j].id, rate: all[j].value ? st.value / all[j].value : null });
    }
    return {
      id: st.id, index: i, value: st.value, derived: !!st.derived,
      stepConv: stepConv, dropAbs: dropAbs, dropRate: dropRate,
      cumulative: cumulative, cpa: cpa, vsPrev: vsPrev,
      warn: (i > 0 && prev !== null && st.value > prev)
    };
  });

  /* ---- break-even gap ---------------------------------------------------- */
  const be = ctx.breakeven_conversions;
  const gap = (be === null || s6 === null) ? null : s6 - be;

  /* ---- cumulative LTV curve --------------------------------------------- */
  const rm = num(ctx.retention_months, 0);
  const months = Math.max(1, Math.min(120, Math.ceil(rm)));
  const curve = [];
  let paybackMonth = null;
  for(let m = 1; m <= months; m++){
    const eff = Math.min(m, rm);
    const rev = (s6 || 0) * num(ctx.avg_ticket, 0) * eff;
    curve.push({ month: m, revenue: rev });
    if(paybackMonth === null && inv > 0 && rev >= inv) paybackMonth = m;
  }

  return {
    scenarioId: scn.id, vars: ctx, funnel: rows,
    totalInvestment: inv, breakevenGap: gap, curve: curve, paybackMonth: paybackMonth,
    costLines: scn.costLines.map(function(c){
      const amt = num(c.amount, 0);
      return {
        id: c.id, label: c.label, category: c.category, amount: amt, includeInROI: c.includeInROI,
        share: (inv > 0 && c.includeInROI) ? amt / inv : (c.includeInROI ? null : 0),
        cacShare: (s6 && c.includeInROI) ? amt / s6 : null
      };
    })
  };
}

/* ---- CONVERSION SPECTRUM (global) --------------------------------------
   The final conversion rate is NOT a scenario property. Stage 5 is the last
   measured step; stage 6 is modelled. The three spectra (optimistic /
   realistic / pessimistic) are configured once in Formula Configuration and
   the active one applies to every scenario at once, so any two scenarios are
   always read under the same conversion assumption. Switching the spectrum
   recomputes; it never writes to a scenario. */
function lensKey(){
  const list = cvrPresets();
  const k = STATE && STATE.settings && STATE.settings.conversionLens;
  if(list.some(function(p){ return p.key === k; })) return k;
  const fb = list.filter(function(p){ return p.key === 'realistic'; })[0] || list[0];
  return fb ? fb.key : 'realistic';
}
function activeCvrPreset(){
  const k = lensKey();
  return cvrPresets().filter(function(p){ return p.key === k; })[0] || { key: k, v: 0.6 };
}
function activeCvr(){ return num(activeCvrPreset().v, 0); }
function calc(scnOrId){
  const scn = typeof scnOrId === 'string' ? scenarioById(scnOrId) : scnOrId;
  if(!scn) return null;
  const key = scn.id + '|' + lensKey() + ':' + activeCvr();
  if(CALC_CACHE[key]) return CALC_CACHE[key];
  const r = computeScenario(scn);
  CALC_CACHE[key] = r;
  return r;
}

function setLens(key){
  STATE.settings.conversionLens = key;
  invalidateCalc(); saveState(); renderAll();
}
function invalidateCalc(id){
  if(!id){ CALC_CACHE = {}; return; }
  // cache keys are "<scenarioId>|<lens>", so drop every lens variant at once
  Object.keys(CALC_CACHE).forEach(function(k){ if(k === id || k.indexOf(id + '|') === 0) delete CALC_CACHE[k]; });
}
function scenarioById(id){
  return STATE.scenarios.filter(function(s){ return s.id === id; })[0] || null;
}
function activeScenario(){
  return DRAFT || scenarioById(STATE.activeScenarioId) || STATE.scenarios[0];
}
function activeCalc(){
  const scn = activeScenario();
  return DRAFT ? computeScenario(scn) : calc(scn);

/* ============================================================================
   FORMAT
   ========================================================================== */
function t(key, params){
  const dict = I18N[STATE ? STATE.lang : 'en'] || I18N.en;
  let s = dict[key] !== undefined ? dict[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if(params) Object.keys(params).forEach(function(k){ s = s.split('{' + k + '}').join(params[k]); });
  return s;
}
function L(obj){
  if(!obj) return '';
  return obj[STATE ? STATE.lang : 'en'] || obj.en || '';
}
function locale(){ return CONFIG.LOCALES[STATE ? STATE.lang : 'en'] || 'en-US'; }

function currency(){
  const c = CONFIG.CURRENCIES.filter(function(x){ return x.code === STATE.settings.currency; })[0];
  return c || CONFIG.CURRENCIES[0];
}
function fxRate(){
  const code = STATE.settings.currency;
  return num(STATE.settings.fxRates[code], 1) || 1;
}

const DASH = '\u2014';

function fmtMoney(usd, digits){
  if(usd === null || usd === undefined || !isFinite(usd)) return DASH;
  const v = usd * fxRate();
  const d = digits === undefined ? (Math.abs(v) >= 1000 ? 0 : 2) : digits;
  try {
    return new Intl.NumberFormat(locale(), {
      style:'currency', currency: currency().code, minimumFractionDigits:d, maximumFractionDigits:d
    }).format(v);
  } catch(e){
    return currency().symbol + v.toFixed(d);
  }
}
function fmtNum(v, digits){
  if(v === null || v === undefined || !isFinite(v)) return DASH;
  const d = digits === undefined ? 0 : digits;
  return new Intl.NumberFormat(locale(), { minimumFractionDigits:d, maximumFractionDigits:d }).format(v);
}
function fmtPct(v, digits){
  if(v === null || v === undefined || !isFinite(v)) return DASH;
  const d = digits === undefined ? 2 : digits;
  return new Intl.NumberFormat(locale(), { style:'percent', minimumFractionDigits:d, maximumFractionDigits:d }).format(v);
}
function fmtRatio(v, digits){
  if(v === null || v === undefined || !isFinite(v)) return DASH;
  return fmtNum(v, digits === undefined ? 2 : digits) + '\u00D7';
}
function fmtPP(v){ // percentage points
  if(v === null || !isFinite(v)) return DASH;
  return fmtNum(v * 100, 1) + ' p.p.';
}

/* Loss-label convention from the source workbook. */
function lossify(v, formatted){
  if(v !== null && isFinite(v) && v < 0 && STATE.settings.showLossLabel) return t('common.loss');
  return formatted;
}
function fmtMoneyS(v, digits){ return lossify(v, fmtMoney(v, digits)); }
function fmtPctS(v, digits){ return lossify(v, fmtPct(v, digits)); }

/* Format any registry variable by its declared unit. */
function fmtVar(varId, v){
  const def = VAR_BY_ID[varId];
  if(v === null || v === undefined || !isFinite(v)) return DASH;
  if(!def) return fmtNum(v, 2);
  switch(def.unit){
    case 'USD':     return fmtMoney(v);
    case 'percent': return fmtPct(v, 2);
    case 'months':  return fmtNum(v, 1) + ' ' + t('unit.months');
    case 'count':   return fmtNum(v, Math.abs(v) < 100 && v % 1 !== 0 ? 1 : 0);
    case 'ratio':   return fmtRatio(v);
    default:        return fmtNum(v, 2);
  }
}
function signClass(v){
  if(v === null || !isFinite(v)) return 'muted';
  return v < 0 ? 'neg' : (v > 0 ? 'pos' : 'muted');
}
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseLoose(str){
  if(typeof str === 'number') return str;
  if(!str) return 0;
  let s = String(str).trim().replace(/[^0-9.,\-]/g, '');
  const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  if(lastComma > lastDot){ s = s.replace(/\./g,'').replace(',', '.'); }
  else { s = s.replace(/,/g,''); }
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

/* ============================================================================

   data (scenarios, formulas, presets, FX, changelog) lives in the team's
   content.json via the parent app. Per-user view state stays in this browser.

const EMBED = (function(){ try { return window.parent !== window && /[?&]embed=1/.test(location.search); } catch(e){ return false; } })();
let EMBED_RO = false, EMBED_LAST = null, EMBED_BOUND = false;
const EMBED_UI_KEYS = ['activeTab','activeScenarioId','viewScenarioId','comparison'];
const EMBED_UI_STORE = 'boost_roi_ui_v1';
function embedUiLoad(){ try { return JSON.parse(localStorage.getItem(EMBED_UI_STORE) || '{}') || {}; } catch(e){ return {}; } }
function embedUiSave(){
  try {
    const u = {}; EMBED_UI_KEYS.forEach(function(k){ u[k] = STATE[k]; });
    u.currency = STATE.settings && STATE.settings.currency;
    localStorage.setItem(EMBED_UI_STORE, JSON.stringify(u));
  } catch(e){}
}
function embedShared(){
  const s = deepClone(STATE);
  EMBED_UI_KEYS.concat(['lang','savedAt']).forEach(function(k){ delete s[k]; });
  if(s.settings) delete s.settings.currency;
  if(Array.isArray(s.changelog)) s.changelog = s.changelog.slice(0, 200);
  return s;
}
function embedPost(msg){ try { window.parent.postMessage(msg, '*'); } catch(e){} }
function embedInit(msg){
  EMBED_RO = !!msg.readOnly;
  const ui = embedUiLoad();
  const base = msg.shared ? deepClone(msg.shared) : { version: CONFIG.SCHEMA_VERSION };
  EMBED_UI_KEYS.forEach(function(k){ if(ui[k] !== undefined) base[k] = ui[k]; });
  base.lang = (msg.lang === 'pt') ? 'pt' : 'en';
  STATE = migrate(base);
  if(ui.currency && CONFIG.CURRENCIES.some(function(c){ return c.code === ui.currency; })) STATE.settings.currency = ui.currency;
  if(!STATE.viewScenarioId || !STATE.scenarios.some(function(x){ return x.id === STATE.viewScenarioId; })) STATE.viewScenarioId = STATE.activeScenarioId;
  DRAFT = null; DIRTY = false; FORMULA_DRAFT = null; FORMULA_DIRTY = false; CALC_CACHE = {};
  const res = rebuildEvalOrder(STATE.formulas);
  if(!res.order){ STATE.formulas = defaultFormulas(); rebuildEvalOrder(STATE.formulas); }
  EMBED_LAST = JSON.stringify(embedShared());
  if(!EMBED_BOUND){ bindGlobal(); EMBED_BOUND = true; }
  renderAll();
}

/* ---- builder events ------------------------------------------------------ */
function bindBuilder(){
  const root = $('#tab-builder');
  if(root._bound) return;
  root._bound = true;

  root.addEventListener('click', function(e){
    const head = e.target.closest('[data-toggle-card]');
    if(head){ head.parentNode.classList.toggle('collapsed'); return; }

    const pr = e.target.closest('[data-preset-ret]');
    if(pr){
      const p = retPresets().filter(function(x){ return x.key === pr.getAttribute('data-preset-ret'); })[0];
      if(!p) return;
      DRAFT.inputs.retention_months = p.months;
      DRAFT.inputs.monthly_churn = p.churn;
      markDirty(); renderBuilder(); return;
    }
    const ca = e.target.closest('[data-cost-act]');
    if(ca){ costAction(ca.getAttribute('data-cost-act'), ca.getAttribute('data-id')); return; }

    if(e.target.id === 'act-addcost'){
      DRAFT.costLines.push({ id: uid('cost'), label: t('builder.costLabel') + ' ' + (DRAFT.costLines.length + 1), category:'Other', amount: 0, includeInROI: true });
      markDirty(); renderBuilder(); return;
    }
    if(e.target.id === 'act-bulkcost'){ openBulkCost(); return; }
    if(e.target.id === 'act-save'){ saveScenario(false); return; }
    if(e.target.id === 'act-savenew'){ saveScenario(true); return; }
    if(e.target.id === 'act-duplicate'){ duplicateScenario(); return; }
    if(e.target.id === 'act-reset'){ resetScenario(); return; }
    if(e.target.id === 'act-delete'){ deleteScenario(); return; }
    if(e.target.id === 'act-family'){ generateFamily(); return; }
  });

  root.addEventListener('input', function(e){
    const el = e.target;
    if(el.id === 'in-name'){ DRAFT.name = el.value; markDirty(); return; }
    if(el.id === 'in-desc'){ DRAFT.description = el.value; markDirty(); return; }
    if(el.id === 'in-tags'){ DRAFT.tags = el.value.split(',').map(function(x){ return x.trim(); }).filter(Boolean); markDirty(); return; }

    if(el.hasAttribute('data-input')){
      const key = el.getAttribute('data-input');
      DRAFT.inputs[key] = Math.max(0, parseLoose(el.value));
      if(key === 'retention_months'){
        const rm = DRAFT.inputs.retention_months;
        DRAFT.inputs.monthly_churn = rm > 0 ? 1 / rm : 0;
        const ch = $('#in-monthly_churn'); if(ch) ch.value = round(DRAFT.inputs.monthly_churn * 100, 4);
      }
      markDirty(); scheduleLive(); return;
    }
    if(el.hasAttribute('data-pctinput')){
      const key = el.getAttribute('data-pctinput');
      let v = parseLoose(el.value) / 100;
      if(v < 0) v = 0;
      if(v > 1) v = 1;              // percentage inputs are capped at 100%
      DRAFT.inputs[key] = v;
      if(key === 'monthly_churn'){
        const ctx = { monthly_churn: v };
        const f = STATE.formulas.RETENTION_MONTHS;
        const rm = FormulaEngine.evaluateRPN(f._rpn || (f._rpn = FormulaEngine.toRPN(f.tokens)), ctx);
        DRAFT.inputs.retention_months = rm === null ? 0 : rm;
        const rmEl = $('#in-retention_months'); if(rmEl) rmEl.value = round(DRAFT.inputs.retention_months, 2);
      }
      markDirty(); scheduleLive(); return;
    }
    if(el.hasAttribute('data-cost')){
      const id = el.getAttribute('data-id');
      const line = DRAFT.costLines.filter(function(c){ return c.id === id; })[0];
      if(!line) return;
      const f = el.getAttribute('data-cost');
      if(f === 'label') line.label = el.value;
      else if(f === 'amount') line.amount = Math.max(0, parseLoose(el.value));
      markDirty(); scheduleLive(); return;
    }
  });

  root.addEventListener('change', function(e){
    const el = e.target;
    if(el.id === 'in-locked'){ DRAFT.locked = el.checked; markDirty(); renderBuilder(); return; }
    if(el.hasAttribute('data-cost')){
      const id = el.getAttribute('data-id');
      const line = DRAFT.costLines.filter(function(c){ return c.id === id; })[0];
      if(!line) return;
      const f = el.getAttribute('data-cost');
      if(f === 'category') line.category = el.value;
      if(f === 'include'){ line.includeInROI = el.checked; }
      markDirty(); scheduleLive(); return;
    }
  });
}

function costAction(act, id){
  const arr = DRAFT.costLines;
  const i = arr.findIndex(function(c){ return c.id === id; });
  if(i < 0) return;
  if(act === 'del') arr.splice(i, 1);
  else if(act === 'dup'){ const cp = deepClone(arr[i]); cp.id = uid('cost'); cp.label = cp.label + ' (copy)'; arr.splice(i + 1, 0, cp); }
  else if(act === 'up' && i > 0){ arr.splice(i - 1, 0, arr.splice(i, 1)[0]); }
  else if(act === 'down' && i < arr.length - 1){ arr.splice(i + 1, 0, arr.splice(i, 1)[0]); }
  markDirty(); renderBuilder();
}

function openBulkCost(){
  openModal(t('builder.pasteBulk'),
    '<p>' + esc(t('builder.pasteHint')) + '</p><textarea id="bulk-text" style="min-height:160px;width:100%"></textarea>',
    [{ label:t('common.cancel'), cls:'btn ghost', act:'close' },
     { label:t('common.confirm'), cls:'btn', act:'yes', fn:function(){
        const txt = $('#bulk-text').value || '';
        let added = 0;
        txt.split(/\r?\n/).forEach(function(line){
          if(!line.trim()) return;
          const parts = line.split(/\t|;|\|/);
          const label = (parts[0] || '').trim() || ('Cost ' + (DRAFT.costLines.length + 1));
          const amount = parseLoose(parts.length > 1 ? parts[1] : '0');
          DRAFT.costLines.push({ id: uid('cost'), label: label, category:'Other', amount: amount, includeInROI: true });
          added++;
        });
        closeModal(); markDirty(); renderBuilder();
        if(added) toast(added + ' \u2713');
     }}]);
}

/* ---- scenario actions ---------------------------------------------------- */
function uniqueName(name, ignoreId){
  const exists = STATE.scenarios.some(function(s){ return s.name === name && s.id !== ignoreId; });
  if(!exists) return { name: name, wasDup: false };
  let i = 2, cand;
  do { cand = name + ' (' + i + ')'; i++; } while(STATE.scenarios.some(function(s){ return s.name === cand; }));
  return { name: cand, wasDup: true };
}

function saveScenario(asNew){
  const target = asNew ? null : scenarioById(DRAFT.id);
  const chk = uniqueName(DRAFT.name, asNew ? null : DRAFT.id);
  if(chk.wasDup) toast(t('builder.dupName', { n: chk.name }));
  if(asNew || !target){
    const cp = deepClone(DRAFT);
    cp.id = uid('scn'); cp.name = chk.name; cp.createdAt = nowISO(); cp.updatedAt = nowISO(); cp.locked = false;
    STATE.scenarios.push(cp);
    STATE.activeScenarioId = cp.id;
    DRAFT = deepClone(cp);
  } else {
    const idx = STATE.scenarios.indexOf(target);
    const cp = deepClone(DRAFT);
    cp.name = chk.name; cp.updatedAt = nowISO();
    STATE.scenarios[idx] = cp;
    DRAFT = deepClone(cp);
  }
  DIRTY = false; invalidateCalc(); saveState(); renderAll();
  toast(t('builder.saved'));
}

function duplicateScenario(){
  const src = scenarioById(STATE.activeScenarioId);
  const cp = deepClone(DRAFT || src);
  cp.id = uid('scn');
  cp.name = uniqueName(cp.name + ' (copy)').name;
  cp.createdAt = nowISO(); cp.updatedAt = nowISO(); cp.locked = false;
  cp.costLines = cp.costLines.map(function(c){ return Object.assign({}, c, { id: uid('cost') }); });
  STATE.scenarios.push(cp);
  STATE.activeScenarioId = cp.id;
  DRAFT = deepClone(cp); DIRTY = false;
  invalidateCalc(); saveState(); renderAll();
}

function resetScenario(){
  confirmDialog(t('builder.resetConfirm'), function(){
    const seed = seedScenarios()[0];
    DRAFT.inputs = deepClone(seed.inputs);
    DRAFT.costLines = deepClone(seed.costLines).map(function(c){ return Object.assign({}, c, { id: uid('cost') }); });
    closeModal(); markDirty(); renderBuilder();
  });
}

function deleteScenario(){
  if(STATE.scenarios.length <= 1){ toast(t('builder.lastMin'), true); return; }
  const scn = scenarioById(STATE.activeScenarioId);
  confirmDialog(t('builder.deleteConfirm', { n: scn.name }), function(){
    STATE.scenarios = STATE.scenarios.filter(function(s){ return s.id !== scn.id; });
    STATE.comparison.ids = STATE.comparison.ids.filter(function(id){ return id !== scn.id; });
    if(STATE.comparison.baselineId === scn.id) STATE.comparison.baselineId = STATE.comparison.ids[0] || null;
    STATE.activeScenarioId = STATE.scenarios[0].id;
    DRAFT = null; DIRTY = false; invalidateCalc(); saveState(); closeModal(); renderAll();
  }, t('builder.delete'), true);
}

function savePresets(kind){
  STATE.settings.presets = sanitizePresets(STATE.settings.presets);
  const P = STATE.settings.presets;
  let bad = false;
  const readPct = function(id, fallback){
    const el = $(id); if(!el) return fallback;
    const v = parseLoose(el.value) / 100;
    if(!(v >= 0 && v <= 1)){ bad = true; return fallback; }
    return v;
  };
  if(kind === 'cvr'){
    const next = P.cvr.map(function(p, i){ return { key: p.key, v: readPct('#pe-cvr-' + i, p.v) }; });
    if(!bad) P.cvr = next;
  } else if(kind === 'ret'){
    const next = P.retention.map(function(p, i){
      const el = $('#pe-ret-' + i);
      const m = el ? parseLoose(el.value) : p.months;
      if(!(m > 0 && m <= 600)){ bad = true; return p; }
      return { key: p.key, months: m, churn: 1 / m };
    });
    if(!bad) P.retention = next;
  }
  if(bad){ toast(t('preset.invalid'), true); return; }
  invalidateCalc(); saveState(); renderAll(); toast(t('preset.saved'));
}
function resetPresets(kind){
  const d = defaultPresets();
  STATE.settings.presets = sanitizePresets(STATE.settings.presets);
  if(kind === 'cvr') STATE.settings.presets.cvr = d.cvr;
  else STATE.settings.presets.retention = d.retention;
  invalidateCalc(); saveState(); renderAll(); toast(t('preset.saved'));
}

function generateFamily(){
  confirmDialog(t('builder.familyConfirm'), function(){
    const base = deepClone(DRAFT);
    let n = 0;
    // Conversion is global, so a family varies only what a scenario owns:
    // the retention assumption. The three conversion spectra are read on top
    // of every one of them from the View and Comparison tabs.
    retPresets().forEach(function(rp){
      const cp = deepClone(base);
      cp.id = uid('scn');
      cp.inputs.retention_months = rp.months;
      cp.inputs.monthly_churn = rp.churn;
      cp.name = uniqueName(base.name + ' \u2014 ' + presetName(rp.key) + ' ' + round(rp.months, 2) + 'm').name;
      cp.tags = (base.tags || []).concat(['family']);
      cp.createdAt = nowISO(); cp.updatedAt = nowISO(); cp.locked = false;
      cp.costLines = cp.costLines.map(function(c){ return Object.assign({}, c, { id: uid('cost') }); });
      STATE.scenarios.push(cp); n++;
    });
    invalidateCalc(); saveState(); closeModal(); renderAll();
    toast(t('builder.familyDone', { n: n }));
  });
}
