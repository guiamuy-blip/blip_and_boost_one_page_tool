    const tk = FORMULA_DRAFT[fid] && FORMULA_DRAFT[fid].tokens[i];
    if(tk && tk.t === 'var') sel.value = tk.v;
  });

  bindFormulas();
}

const VAR_OPTIONS_CACHE = {};
function varOptions(excludeTarget){
  const key = STATE.lang + '|' + excludeTarget;
  if(VAR_OPTIONS_CACHE[key]) return VAR_OPTIONS_CACHE[key];
  const groups = [
    { key:'input', label:t('common.input') },
    { key:'derived', label:t('common.derived') }
  ];
  let html = '<option value="__num">\u2022 ' + esc(t('common.value')) + ' (const)</option>';
  groups.forEach(function(g){
    html += '<optgroup label="' + esc(g.label) + '">';
    VARIABLE_REGISTRY.filter(function(v){ return v.type === g.key && v.id !== excludeTarget; }).forEach(function(v){
      html += '<option value="' + v.id + '">' + esc(L(v.label)) + ' (' + esc(v.symbol) + ')</option>';
    });
    html += '</optgroup>';
  });
  VAR_OPTIONS_CACHE[key] = html;
  return html;
}

function renderFormulaCard(def){
  const tokens = FORMULA_DRAFT[def.id].tokens;
  const st = formulaStatus(def.id);
  const badge = st.key === 'invalid' ? '<span class="badge invalid">Invalid</span>'
    : st.key === 'legacy' ? '<span class="badge legacy">Legacy</span>'
    : st.key === 'modified' ? '<span class="badge modified">Modified</span>'
    : '<span class="badge default">Default</span>';

  const expr = tokens.map(function(tk, i){
    if(tk.t === 'op'){
      return '<span class="term"><select class="op" data-fx="' + def.id + '" data-i="' + i + '" data-kind="op" aria-label="operator">' +
        OPERATORS.map(function(o){ return '<option value="' + esc(o) + '"' + (o === tk.v ? ' selected' : '') + '>' + esc(OP_LABEL[o]) + '</option>'; }).join('') +
        '</select></span>';
    }
    if(tk.t === 'num'){
      return '<span class="term"><input class="const" type="number" step="any" data-fx="' + def.id + '" data-i="' + i + '" data-kind="num" value="' + tk.v + '" aria-label="constant">' +
        '<button class="icon-btn" data-fx-tovar="' + def.id + '" data-i="' + i + '" aria-label="to variable">\u21C4</button></span>';
    }
    return '<span class="term"><select class="var" data-fx="' + def.id + '" data-i="' + i + '" data-kind="var" aria-label="variable">' +
      varOptions(def.target) + '</select></span>';
  }).join('');

  const errMsg = st.key === 'invalid'
    ? '<div class="alert err">' + esc(formulaErrorText(def, st.detail)) + '</div>' : '';

  return '<div class="formula-card" data-fxcard="' + def.id + '">' +
    '<div class="formula-head"><span class="f-name">' + esc(L(def.label)) + '</span>' +
      '<span class="f-target">' + esc(VAR_BY_ID[def.target].symbol) + ' =</span>' + badge +
    '</div>' +
    '<div class="expr">' + expr + '</div>' + errMsg +
    '<div class="formula-foot">' +
      '<button class="btn ghost sm" data-fx-add="' + def.id + '">' + esc(t('formula.addTerm')) + '</button>' +
      '<button class="btn ghost sm" data-fx-del="' + def.id + '">' + esc(t('formula.removeTerm')) + '</button>' +
      '<button class="btn ghost sm" data-fx-preview="' + def.id + '">' + esc(t('formula.preview')) + '</button>' +
      '<button class="btn ghost sm" data-fx-reset="' + def.id + '">' + esc(t('formula.resetOne')) + '</button>' +
      '<span class="preview-out" id="fxout-' + def.id + '"></span>' +
    '</div></div>';
}

function formulaErrorText(def, detail){
  const name = L(def.label);
  if(detail.code === 'unknown_var') return t('formula.invalidVar', { f: name, i: detail.index });
  return t('formula.invalidSyntax', { f: name, i: detail.index });
}

function bindFormulas(){
  const root = $('#tab-formulas');
  if(root._bound) return;
  root._bound = true;

  root.addEventListener('change', function(e){
    const el = e.target;
    if(el.hasAttribute('data-fx')){
      const fid = el.getAttribute('data-fx'), i = parseInt(el.getAttribute('data-i'), 10);
      const tk = FORMULA_DRAFT[fid].tokens[i];
      const kind = el.getAttribute('data-kind');
      if(kind === 'op') tk.v = el.value;
      else if(kind === 'var'){
        if(el.value === '__num'){ FORMULA_DRAFT[fid].tokens[i] = { t:'num', v: 1 }; }
        else tk.v = el.value;
      }
      FORMULA_DIRTY = true; renderFormulas(); renderSaveIndicator(); return;
    }
    if(el.id === 'set-loss'){ STATE.settings.showLossLabel = el.checked; saveState(); renderAll(); return; }
    if(el.id === 'set-round'){ STATE.settings.roundContracted = el.checked; invalidateCalc(); saveState(); renderAll(); return; }
    if(el.id === 'set-fx'){
      STATE.settings.fxRates[STATE.settings.currency] = Math.max(0.0001, parseLoose(el.value));
      saveState(); renderAll(); return;
    }
  });

  root.addEventListener('input', function(e){
    const el = e.target;
    if(el.getAttribute && el.getAttribute('data-kind') === 'num'){
      const fid = el.getAttribute('data-fx'), i = parseInt(el.getAttribute('data-i'), 10);
      FORMULA_DRAFT[fid].tokens[i] = { t:'num', v: parseLoose(el.value) };
      FORMULA_DIRTY = true; renderSaveIndicator();
    }
  });

  root.addEventListener('click', function(e){
    const add = e.target.closest('[data-fx-add]');
    if(add){
      const fid = add.getAttribute('data-fx-add');
      FORMULA_DRAFT[fid].tokens.push({ t:'op', v:'+' }, { t:'num', v: 0 });
      FORMULA_DIRTY = true; renderFormulas(); return;
    }
    const del = e.target.closest('[data-fx-del]');
    if(del){
      const fid = del.getAttribute('data-fx-del');
      const arr = FORMULA_DRAFT[fid].tokens;
      if(arr.length > 1) arr.splice(Math.max(1, arr.length - 2), 2);
      FORMULA_DIRTY = true; renderFormulas(); return;
    }
    const tovar = e.target.closest('[data-fx-tovar]');
    if(tovar){
      const fid = tovar.getAttribute('data-fx-tovar'), i = parseInt(tovar.getAttribute('data-i'), 10);
      FORMULA_DRAFT[fid].tokens[i] = { t:'var', v:'avg_ticket' };
      FORMULA_DIRTY = true; renderFormulas(); return;
    }
    const rs = e.target.closest('[data-fx-reset]');
    if(rs){
      const fid = rs.getAttribute('data-fx-reset');
      FORMULA_DRAFT[fid].tokens = FormulaEngine.clone(FORMULA_BY_ID[fid].tokens);
      FORMULA_DIRTY = true; renderFormulas(); return;
    }
    const pv = e.target.closest('[data-fx-preview]');
    if(pv){ previewFormula(pv.getAttribute('data-fx-preview')); return; }
    if(e.target.id === 'fx-save' || e.target.id === 'fx-save-top'){ saveFormulas(); return; }
    if(e.target.id === 'fx-reset-all'){
      confirmDialog(t('formula.resetAllConfirm'), function(){
        Object.keys(FORMULA_DRAFT).forEach(function(fid){ FORMULA_DRAFT[fid].tokens = FormulaEngine.clone(FORMULA_BY_ID[fid].tokens); });
        FORMULA_DIRTY = true; closeModal(); renderFormulas();
      });
      return;
    }
  });
}

function previewFormula(fid){
  const out = $('#fxout-' + fid);
  const def = FORMULA_BY_ID[fid];
  const v = FormulaEngine.validate(FORMULA_DRAFT[fid].tokens);
  if(!v.ok){ out.textContent = formulaErrorText(def, v); out.style.color = 'var(--status-negative)'; return; }
  // Evaluate with the saved model as context, replacing only this formula.
  const scn = activeScenario();
  const c = computeScenario(scn);
  const ctx = Object.assign({}, c.vars);
  const val = FormulaEngine.evaluateRPN(FormulaEngine.toRPN(FORMULA_DRAFT[fid].tokens), ctx);
  out.style.color = 'var(--accent-cyan)';
  out.textContent = VAR_BY_ID[def.target].symbol + ' = ' + (val === null ? t('common.na') : fmtVar(def.target, val));
}

function saveFormulas(){
  const errors = [];
  Object.keys(FORMULA_DRAFT).forEach(function(fid){
    const v = FormulaEngine.validate(FORMULA_DRAFT[fid].tokens);
    if(!v.ok) errors.push(formulaErrorText(FORMULA_BY_ID[fid], v));
  });
  if(errors.length){
    openModal(t('formula.blocked', { n: errors.length }), '<ul>' + errors.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>');
    return;
  }
  const set = {};
  Object.keys(FORMULA_DRAFT).forEach(function(fid){ set[fid] = FORMULA_DRAFT[fid].tokens; });
  const res = FormulaEngine.resolveOrder(set);
  if(res.cycle){
    const def = FORMULA_BY_ID[res.cycle.formulaId];
    openModal(t('formula.blocked', { n: 1 }),
      '<p>' + esc(t('formula.circular', { f: L(def.label), v: L(VAR_BY_ID[res.cycle.via].label) })) + '</p>');
    return;
  }
  // changelog
  let changes = 0;
  Object.keys(FORMULA_DRAFT).forEach(function(fid){
    const before = STATE.formulas[fid].tokens, after = FORMULA_DRAFT[fid].tokens;
    if(JSON.stringify(before) === JSON.stringify(after)) return;
    changes++;
    STATE.changelog.unshift({
      at: nowISO(), formula: L(FORMULA_BY_ID[fid].label),
      from: FormulaEngine.toText(before, STATE.lang, true),
      to: FormulaEngine.toText(after, STATE.lang, true)
    });
  });
  STATE.changelog = STATE.changelog.slice(0, CONFIG.CHANGELOG_MAX);
  if(!changes){ toast(t('formula.noChanges')); FORMULA_DIRTY = false; renderSaveIndicator(); return; }

  Object.keys(FORMULA_DRAFT).forEach(function(fid){
    const isDefault = JSON.stringify(FORMULA_DRAFT[fid].tokens) === JSON.stringify(FORMULA_BY_ID[fid].tokens);
    STATE.formulas[fid] = { tokens: FormulaEngine.clone(FORMULA_DRAFT[fid].tokens), modified: !isDefault };
  });
  rebuildEvalOrder(STATE.formulas);
  invalidateCalc();
  FORMULA_DIRTY = false;
  saveState();
  renderAll();
  toast(t('formula.saved', { n: STATE.scenarios.length }));
}
/* ============================================================================
   CHARTS — hand-rolled SVG. Literal hex colours so exported SVG/PNG resolves
   without the stylesheet.
   ========================================================================== */
const C = {
  orange:'#FF5C00', orangeDim:'#8A3200', blue:'#0084FF', cyan:'#00D2FF',
  neg:'#E5484D', pos:'#30A46C', grid:'#333333', text:'#FFFFFF', text2:'#A0A0A0', dim:'#6E6E6E', surface:'#1C1C1C'
};

function svgOpen(w, h, cls){
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" preserveAspectRatio="xMidYMid meet" ' +
    'role="img" class="' + (cls || '') + '" xmlns="http://www.w3.org/2000/svg">';
}
function txt(x, y, s, opts){
  const o = opts || {};
  return '<text x="' + x + '" y="' + y + '" fill="' + (o.fill || C.text2) + '" font-size="' + (o.size || 11) + '" ' +
    'font-weight="' + (o.weight || 400) + '" text-anchor="' + (o.anchor || 'start') + '" ' +
    (o.ls ? 'letter-spacing="' + o.ls + '" ' : '') + '>' + esc(s) + '</text>';
}
function rect(x, y, w, h, fill, r){
  return '<rect x="' + x + '" y="' + y + '" width="' + Math.max(0, w) + '" height="' + Math.max(0, h) + '" fill="' + fill + '" rx="' + (r === undefined ? 3 : r) + '"/>';
}
function line(x1, y1, x2, y2, stroke, dash){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + stroke + '" stroke-width="1"' +
    (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
}

/* ---- 1. horizontal funnel ------------------------------------------------ */
function svgFunnel(c, opts){
  const o = opts || {};
  const rows = c.funnel;
  const W = 940, labelW = 190, barMax = 540, rowH = 46, gap = 26;
  const H = rows.length * (rowH + gap) + 24;
  const max = Math.max.apply(null, rows.map(function(r){ return r.value; }).concat([1]));
  let s = svgOpen(W, H);
  rows.forEach(function(r, i){
    const y = 10 + i * (rowH + gap);
    const w = max > 0 ? (r.value / max) * barMax : 0;
    const fill = r.derived ? C.cyan : C.orange;
    s += '<g class="fn-stage" data-stage="' + i + '" tabindex="0">';
    s += rect(labelW, y, w, rowH, fill, 3);
    if(r.derived) s += '<rect x="' + labelW + '" y="' + y + '" width="' + Math.max(0, w) + '" height="' + rowH + '" fill="none" stroke="' + C.cyan + '" stroke-dasharray="4 3" rx="3"/>';
    s += txt(labelW - 10, y + 19, (i + 1) + '. ' + L(VAR_BY_ID[r.id].label), { anchor:'end', fill:C.text, size:12, weight:600 });
    s += txt(labelW - 10, y + 35, fmtPct(r.cumulative, 2) + ' ' + t('builder.vsUU'), { anchor:'end', fill:C.dim, size:10 });
    s += txt(labelW + Math.max(w, 4) + 10, y + 28, fmtNum(r.value, 0), { fill:C.text, size:15, weight:700 });
    if(r.derived) s += txt(labelW + Math.max(w, 4) + 10 + String(fmtNum(r.value, 0)).length * 9 + 10, y + 28, '\u2022 ' + t('view.derivedStage'), { fill:C.cyan, size:9 });
    s += '</g>';
    if(i < rows.length - 1){
      const next = rows[i + 1];
      const cy = y + rowH + gap / 2 + 2;
      s += line(labelW + 8, y + rowH + 4, labelW + 8, cy + 6, C.grid);
      s += txt(labelW + 16, cy + 8, '\u2193 ' + fmtPct(next.stepConv, 2) + '  \u00B7  \u2212' + fmtNum(next.dropAbs, 0) + ' ' + t('unit.count'), { fill:C.text2, size:10.5 });
    }
  });
  s += '</svg>';
  return s;
}

/* ---- 2. drop-off bars ---------------------------------------------------- */
function svgDropoff(c){
  const rows = c.funnel.slice(1).filter(function(r){ return r.dropAbs !== null && r.dropAbs > 0; })
    .sort(function(a, b){ return b.dropAbs - a.dropAbs; });
  if(!rows.length) return '<p class="hint">' + esc(DASH) + '</p>';
  const W = 940, labelW = 250, barMax = 520, rowH = 26, gap = 12;
  const H = rows.length * (rowH + gap) + 10;
  const max = rows[0].dropAbs || 1;
  let s = svgOpen(W, H);
  rows.forEach(function(r, i){
    const y = 4 + i * (rowH + gap);
    const w = (r.dropAbs / max) * barMax;
    const isTop = i === 0;
    const from = L(VAR_BY_ID[c.funnel[r.index - 1].id].label);
    const to = L(VAR_BY_ID[r.id].label);
    s += txt(labelW - 10, y + 17, from + ' \u2192 ' + to, { anchor:'end', fill: isTop ? C.text : C.text2, size:11, weight: isTop ? 700 : 400 });
    s += rect(labelW, y, w, rowH, isTop ? C.neg : '#5A2326', 2);
    s += txt(labelW + w + 8, y + 17, '\u2212' + fmtNum(r.dropAbs, 0) + '  (' + fmtPct(r.dropRate, 1) + ')', { fill: isTop ? C.text : C.text2, size:11, weight: isTop ? 700 : 400 });
    if(isTop) s += txt(labelW, y - 2, t('view.bottleneck').toUpperCase(), { fill:C.neg, size:9, weight:700, ls:'1' });
  });
  s += '</svg>';
  return s;
}

/* ---- 3. waterfall -------------------------------------------------------- */
function svgWaterfall(c){
  const v = c.vars;
  const tgr = v.total_gross_revenue_ltv, ti = c.totalInvestment;
  const roi = v.roi_revenue_abs;
  if(tgr === null) return '<p class="hint">' + esc(DASH) + '</p>';
  const steps = [
    { label: L(VAR_BY_ID.total_gross_revenue_ltv.label), from: 0, to: tgr, color: C.orange, kind:'abs' },
    { label: L(VAR_BY_ID.total_investment.label), from: tgr, to: tgr - ti, color: C.neg, kind:'delta' },
    { label: L(VAR_BY_ID.roi_revenue_abs.label), from: 0, to: (roi === null ? tgr - ti : roi), color: (tgr - ti) < 0 ? C.neg : C.pos, kind:'abs' }
  ];
  const W = 940, H = 300, padL = 70, padB = 58, padT = 20, colW = (W - padL - 30) / steps.length;
  const vals = steps.reduce(function(a, s){ return a.concat([s.from, s.to]); }, [0]);
  const maxV = Math.max.apply(null, vals), minV = Math.min.apply(null, vals);
  const span = (maxV - minV) || 1;
  const y0 = function(val){ return padT + (maxV - val) / span * (H - padT - padB); };
  let s = svgOpen(W, H);
  s += line(padL - 10, y0(0), W - 10, y0(0), C.grid);
  s += txt(padL - 14, y0(0) + 3, '0', { anchor:'end', fill:C.dim, size:10 });
  steps.forEach(function(st, i){
    const x = padL + i * colW + colW * 0.18;
    const bw = colW * 0.64;
    const top = Math.min(y0(st.from), y0(st.to)), bot = Math.max(y0(st.from), y0(st.to));
    s += rect(x, top, bw, Math.max(2, bot - top), st.color, 2);
    s += txt(x + bw / 2, top - 7, fmtMoney(st.kind === 'abs' ? st.to : (st.to - st.from), 0), { anchor:'middle', fill:C.text, size:12, weight:700 });
    wrapLabel(st.label, x + bw / 2, H - padB + 18, 15).forEach(function(l, k){
      s += txt(x + bw / 2, H - padB + 18 + k * 12, l, { anchor:'middle', fill:C.text2, size:10 });
    });
    if(i > 0 && steps[i-1].kind !== undefined){
      s += line(padL + (i-1) * colW + colW * 0.82, y0(steps[i-1].to), x, y0(steps[i-1].to), C.grid, '3 3');
    }
  });
  s += '</svg>';
  return s;
}
function wrapLabel(str, x, y, maxChars){
  const words = String(str).split(' '), lines = [];
  let cur = '';
  words.forEach(function(w){
    if((cur + ' ' + w).trim().length > maxChars){ if(cur) lines.push(cur); cur = w; }
    else cur = (cur + ' ' + w).trim();
  });
  if(cur) lines.push(cur);
  return lines.slice(0, 3);
}

/* ---- 4. ROI sensitivity to final CVR ------------------------------------- */
function svgSensitivity(scn, c){
  const W = 940, H = 300, padL = 66, padR = 20, padT = 18, padB = 42;
  const pts = [];
  for(let i = 0; i <= 100; i++){
    const cvr = i / 100;
    const r = computeScenario(scn, { final_conversion_rate: cvr });
    pts.push({ x: cvr, y: r.vars.roi_revenue_pct });
  }
  const ys = pts.map(function(p){ return p.y; }).filter(function(y){ return y !== null && isFinite(y); });
  if(!ys.length) return '<p class="hint">' + esc(t('common.na')) + '</p>';
  let maxY = Math.max.apply(null, ys), minY = Math.min.apply(null, ys);
  if(maxY === minY){ maxY += 0.1; minY -= 0.1; }
  const pad = (maxY - minY) * 0.08;
  maxY += pad; minY -= pad;
  const X = function(v){ return padL + v * (W - padL - padR); };
  const Y = function(v){ return padT + (maxY - v) / (maxY - minY) * (H - padT - padB); };
  let s = svgOpen(W, H);
  // grid
  for(let g = 0; g <= 4; g++){
    const val = minY + (maxY - minY) * g / 4;
    const y = Y(val);
    s += line(padL, y, W - padR, y, C.grid, '2 4');
    s += txt(padL - 8, y + 3, fmtPct(val, 0), { anchor:'end', fill:C.dim, size:10 });
  }
  for(let g = 0; g <= 10; g += 2){
    s += txt(X(g / 10), H - padB + 16, (g * 10) + '%', { anchor:'middle', fill:C.dim, size:10 });
  }
  if(minY < 0 && maxY > 0) s += line(padL, Y(0), W - padR, Y(0), C.text2);
  // path
  let d = '';
  pts.forEach(function(p, i){
    if(p.y === null) return;
    d += (d ? ' L ' : 'M ') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1);
  });
  s += '<path d="' + d + '" fill="none" stroke="' + C.orange + '" stroke-width="2"/>';
  // break-even marker
  const be = c.vars.breakeven_cvr;
  if(be !== null && be >= 0 && be <= 1){
    s += line(X(be), padT, X(be), H - padB, C.cyan, '4 3');
    s += txt(X(be) + 6, padT + 12, 'break-even ' + fmtPct(be, 1), { fill:C.cyan, size:10, weight:600 });
  }
  // current point
  const cur = activeCvr();
  const curY = c.vars.roi_revenue_pct;
  if(curY !== null){
    s += '<circle cx="' + X(cur) + '" cy="' + Y(curY) + '" r="5" fill="' + C.text + '"/>';
    s += txt(X(cur) + 10, Y(curY) - 8, t('view.currentPoint') + ' ' + fmtPct(cur, 0) + ' \u2192 ' + fmtPct(curY, 1),
      { fill:C.text, size:11, weight:700 });
  }
  s += txt(padL, H - 4, t('builder.finalConvRate'), { fill:C.text2, size:10 });
  s += '</svg>';
  return s;
}

/* ---- 5. cumulative LTV curve --------------------------------------------- */
function svgLtvCurve(c){
  const curve = c.curve;
  if(!curve.length) return '<p class="hint">' + esc(DASH) + '</p>';
  const W = 940, H = 280, padL = 76, padR = 20, padT = 16, padB = 40;
  const maxV = Math.max(curve[curve.length-1].revenue, c.totalInvestment) * 1.08 || 1;
  const X = function(m){ return padL + (m - 1) / Math.max(1, curve.length - 1) * (W - padL - padR); };
  const Y = function(v){ return padT + (1 - v / maxV) * (H - padT - padB); };
  let s = svgOpen(W, H);
  for(let g = 0; g <= 4; g++){
    const val = maxV * g / 4, y = Y(val);
    s += line(padL, y, W - padR, y, C.grid, '2 4');
    s += txt(padL - 8, y + 3, fmtMoney(val, 0), { anchor:'end', fill:C.dim, size:10 });
  }
  let dR = '';
  curve.forEach(function(p){
    dR += (dR ? ' L ' : 'M ') + X(p.month).toFixed(1) + ' ' + Y(p.revenue).toFixed(1);
  });
  s += '<path d="' + dR + '" fill="none" stroke="' + C.orange + '" stroke-width="2"/>';
  if(c.totalInvestment > 0 && c.totalInvestment <= maxV){
    s += line(padL, Y(c.totalInvestment), W - padR, Y(c.totalInvestment), C.neg, '5 4');
    s += txt(W - padR, Y(c.totalInvestment) - 6, L(VAR_BY_ID.total_investment.label) + ' ' + fmtMoney(c.totalInvestment, 0), { anchor:'end', fill:C.neg, size:10, weight:600 });
  }
  if(c.paybackMonth){
    const p = curve[c.paybackMonth - 1];
    s += line(X(p.month), padT, X(p.month), H - padB, C.pos, '3 3');
    s += '<circle cx="' + X(p.month) + '" cy="' + Y(p.revenue) + '" r="4.5" fill="' + C.pos + '"/>';
    s += txt(X(p.month) + 8, padT + 12, t('view.paybackMonth', { n: c.paybackMonth }), { fill:C.pos, size:10.5, weight:700 });
  }
  const stepM = curve.length > 24 ? 6 : (curve.length > 12 ? 3 : 2);
  for(let m = 1; m <= curve.length; m += stepM) s += txt(X(m), H - padB + 16, String(m), { anchor:'middle', fill:C.dim, size:10 });
  s += '</svg>';
  return s +
    '<div class="legend"><span><i style="background:' + C.orange + '"></i>' + esc(L(VAR_BY_ID.total_gross_revenue_ltv.label)) + '</span>' +
    '<span><i style="background:' + C.neg + '"></i>' + esc(L(VAR_BY_ID.total_investment.label)) + '</span></div>';
}

  s += t('view.funnelDetail') + ':' + nl;
  c.funnel.forEach(function(r){
    s += '  ' + (r.index + 1) + '. ' + L(VAR_BY_ID[r.id].label) + ': ' + fmtNum(r.value, 0) +

function slug(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'boost';
}

function copyText(text){
  const done = function(){ toast(t('view.copied')); };
  const fail = function(){
    openModal(t('view.copyText'), '<textarea style="min-height:280px;width:100%">' + esc(text) + '</textarea>');
    toast(t('view.copyFail'), true);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); done();
    } catch(e){ fail(); }
  }
}
/* ============================================================================
   RENDER — TAB 4 : SCENARIO COMPARISON
   ========================================================================== */
const CMP_KPIS = [
  { id:'total_investment',      get:function(c){ return c.totalInvestment; },      fmt:'money', better:'lower' },
  { id:'s6_contracted_plans',   get:function(c){ return c.vars.s6_contracted_plans; }, fmt:'count', better:'higher' },
  { id:'end_to_end_conversion', get:function(c){ return c.vars.end_to_end_conversion; }, fmt:'pct', better:'higher' },
  { id:'cac',                   get:function(c){ return c.vars.cac; },             fmt:'money2', better:'lower' },
  { id:'ltv_gross_per_user',    get:function(c){ return c.vars.ltv_gross_per_user; }, fmt:'money2', better:'higher' },
  { id:'total_gross_revenue_ltv', get:function(c){ return c.vars.total_gross_revenue_ltv; }, fmt:'money', better:'higher' },
  { id:'roi_revenue_abs',       get:function(c){ return c.vars.roi_revenue_abs; }, fmt:'moneyS', better:'higher' },
  { id:'roi_revenue_pct',       get:function(c){ return c.vars.roi_revenue_pct; }, fmt:'pctS', better:'higher' },
  { id:'roas',                  get:function(c){ return c.vars.roas; },            fmt:'ratio', better:'higher' },
  { id:'payback_months',        get:function(c){ return c.vars.payback_months; },  fmt:'months', better:'lower' }
];

function fmtBy(kind, v){
  if(v === null || v === undefined || !isFinite(v)) return t('common.na');
  switch(kind){
    case 'money':  return fmtMoney(v);
    case 'money2': return fmtMoney(v, 2);
    case 'moneyS': return fmtMoneyS(v);
    case 'pct':    return fmtPct(v, 2);
    case 'pctS':   return fmtPctS(v, 2);
    case 'ratio':  return fmtRatio(v);
    case 'count':  return fmtNum(v, 0);
    case 'months': return fmtNum(v, 1) + ' ' + t('unit.months');
    default:       return fmtNum(v, 2);
  }
}

function cmpSelected(){
  const ids = (STATE.comparison.ids || []).filter(function(id){ return !!scenarioById(id); });
  if(!ids.length){
    const seed = STATE.scenarios.slice(0, Math.min(CONFIG.MAX_COMPARE, STATE.scenarios.length)).map(function(s){ return s.id; });
    STATE.comparison.ids = seed;
    STATE.comparison.baselineId = seed[0] || null;
    return seed;
  }
  if(!STATE.comparison.baselineId || ids.indexOf(STATE.comparison.baselineId) < 0) STATE.comparison.baselineId = ids[0];
  return ids;
}

function renderCompare(){
  const ids = cmpSelected();
  const chips = STATE.scenarios.map(function(s){
    const i = ids.indexOf(s.id);
    const on = i >= 0;
    const color = on ? CONFIG.SCENARIO_COLORS[i] : 'transparent';
    return '<button class="scn-chip' + (on ? ' on' : '') + '" data-cmp-toggle="' + esc(s.id) + '">' +
      '<span class="dot" style="background:' + color + ';border:1px solid ' + (on ? color : 'var(--border-input)') + '"></span>' +
      esc(s.name) + (STATE.comparison.baselineId === s.id ? ' <span class="base-tag">' + esc(t('common.baseline')) + '</span>' : '') +
      '</button>';
  }).join(' ');

  if(ids.length < 2){
    $('#tab-compare').innerHTML =
      '<h1 class="section-title">' + esc(t('tab.compare')) + '</h1>' +
      '<p class="hint">' + esc(t('cmp.select', { n: CONFIG.MAX_COMPARE })) + '</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">' + chips + '</div>' +
      '<div class="alert info">' + esc(t('cmp.needTwo')) + '</div>';
    bindCompare();
    return;
  }

  const set = ids.map(function(id, i){
    const s = scenarioById(id);
    return { scn: s, c: calc(s), color: CONFIG.SCENARIO_COLORS[i], idx: i };
  });
  const baseIdx = Math.max(0, ids.indexOf(STATE.comparison.baselineId));
  const base = set[baseIdx];

  /* ---- KPI grid --------------------------------------------------------- */
  const kpiRows = CMP_KPIS.map(function(k){
    const bv = k.get(base.c);
    return '<tr><td>' + esc(L(VAR_BY_ID[k.id].label)) + ' <span class="muted">(' + esc(VAR_BY_ID[k.id].symbol) + ')</span></td>' +
      set.map(function(x){
        const v = k.get(x.c);
        let delta = '';
        if(x.idx !== baseIdx){
          if(v === null || bv === null || !isFinite(v) || !isFinite(bv)) delta = '<span class="delta-flat">' + DASH + '</span>';
          else {
            const d = v - bv;
            // A relative delta against a zero or negative baseline is arithmetic
            // noise: -1.36% -> +187.5% would print as "+13,867%". In that case
            // only the absolute / percentage-point movement is shown.
            const rel = bv > 0 ? d / bv : null;
            const good = (k.better === 'higher' ? d > 0 : d < 0);
            const dTxt = (k.fmt === 'pct' || k.fmt === 'pctS') ? fmtPP(d) : fmtBy(k.fmt === 'moneyS' ? 'money' : k.fmt, d);
            const flat = Math.abs(d) < 1e-9 || !/[1-9]/.test(dTxt);   // rounds away at display precision
            const cls = flat ? 'delta-flat' : (good ? 'delta-up' : 'delta-down');
            const arrow = flat ? '\u2192' : (d > 0 ? '\u25B2' : '\u25BC');
            delta = '<span class="' + cls + '">' + arrow + ' ' + esc(dTxt) +
              (rel === null ? '' : ' (' + esc(fmtPct(rel, 1)) + ')') + '</span>';
          }
        } else {
          delta = '<span class="muted" style="font-size:10px">' + esc(t('common.baseline')) + '</span>';
        }
        return '<td class="num"><div style="font-weight:700;color:' + x.color + '">' + fmtBy(k.fmt, v) + '</div>' +
          '<div style="font-size:10px;margin-top:3px">' + delta + '</div></td>';
      }).join('') + '</tr>';
  }).join('');

  const kpiGrid = '<div class="table-wrap"><table><thead><tr><th>KPI</th>' +
    set.map(function(x){
      return '<th class="num"><span style="color:' + x.color + '">\u25A0</span> ' + esc(x.scn.name) + '</th>';
    }).join('') + '</tr></thead><tbody>' + kpiRows + '</tbody></table></div>';

  /* ---- winner ----------------------------------------------------------- */
  const winner = set.slice().sort(function(a, b){
    const av = a.c.vars.roi_revenue_pct, bv = b.c.vars.roi_revenue_pct;
    return (bv === null ? -Infinity : bv) - (av === null ? -Infinity : av);
  })[0];
  const winnerBlock =
    '<div class="winner"><div class="w-label">' + esc(t('cmp.winner')) + '</div>' +
      '<div class="w-text">' + esc(winnerSentence(winner, base)) + '</div>' +
      '<div class="hint" style="margin-top:8px">' + esc(t('cmp.baselineIs', { n: base.scn.name })) + '</div></div>';

  /* ---- delta table ------------------------------------------------------ */
  const deltaTable = '<div class="table-wrap"><table><thead><tr><th>' + esc(t('common.delta')) + '</th>' +
    set.filter(function(x){ return x.idx !== baseIdx; }).map(function(x){
      return '<th class="num" style="color:' + x.color + '">' + esc(x.scn.name) + '</th>';
    }).join('') + '</tr></thead><tbody>' +
    CMP_KPIS.map(function(k){
      const bv = k.get(base.c);
      return '<tr><td>' + esc(L(VAR_BY_ID[k.id].label)) + '</td>' +
        set.filter(function(x){ return x.idx !== baseIdx; }).map(function(x){
          const v = k.get(x.c);
          if(v === null || bv === null) return '<td class="num muted">' + DASH + '</td>';
          const d = v - bv, rel = bv > 0 ? d / bv : null;   // see KPI-grid note
          const good = (k.better === 'higher' ? d > 0 : d < 0);
          const dTxt = (k.fmt === 'pct' || k.fmt === 'pctS') ? fmtPP(d) : fmtBy(k.fmt === 'moneyS' ? 'money' : k.fmt, d);
          const flat = Math.abs(d) < 1e-9 || !/[1-9]/.test(dTxt);   // see KPI-grid note
          return '<td class="num ' + (flat ? 'delta-flat' : (good ? 'delta-up' : 'delta-down')) + '">' +
            esc(dTxt) + (rel === null ? '' : ' <span class="muted">(' + esc(fmtPct(rel, 1)) + ')</span>') + '</td>';

function winnerSentence(winner, base){
  const wv = winner.c.vars, bv = base.c.vars;
  const roas = wv.roas === null ? DASH : fmtNum(wv.roas, 2);
  // Both sides stated in ROAS. Pairing a ROAS headline with a percentage-point
  // delta of a different metric (ROI %) reads as a unit error to a CFO.
  const broas = bv.roas === null ? DASH : fmtNum(bv.roas, 2);
  const wi = winner.c.totalInvestment, bi = base.c.totalInvestment;
  const wcac = wv.cac, bcac = bv.cac;
  const wp = wv.s6_contracted_plans, bp = bv.s6_contracted_plans;
  let driver;
  if(winner.scn.id === base.scn.id){
    driver = t('cmp.driverMixed');
  } else if(bi > 0 && wi < bi * 0.9){
    driver = t('cmp.driverInvestment', { p: fmtPct((bi - wi) / bi, 0) });
  } else if(wcac !== null && bcac !== null && wcac < bcac * 0.9){
    driver = t('cmp.driverEfficiency', { p: fmtPct((bcac - wcac) / bcac, 0) });
  } else if(bp && wp > bp * 1.05 && Math.abs(wi - bi) < bi * 0.1){
    driver = t('cmp.driverVolume', { p: fmtPct((wp - bp) / bp, 0) });
  } else if(bi > 0 && wi > bi * 1.1){
    driver = t('cmp.driverInvestmentUp', { p: fmtPct((wi - bi) / bi, 0) });
  } else {
    driver = t('cmp.driverMixed');
  }
  return t('cmp.winnerText', { name: winner.scn.name, roas: roas, broas: broas, driver: driver });
}

/* ---- overlaid funnels ---------------------------------------------------- */
/* Why a positive revenue ROI can still sit next to a negative gross-profit ROI.
   Stated as arithmetic, in the scenario's own numbers, instead of leaving the
   reader to assume a defect. */
/* Single source of truth for "is the legacy method on": the saved formula
   tokens. A separate boolean in settings could drift out of sync with the
   formula the engine actually runs. */
/* This model stops at revenue. ROAS and revenue ROI are top-line measures: they
   say how much lifetime revenue the media bought, not whether the cohort was
   profitable. The caveat is stated on screen rather than left to the reader. */
function topLineNote(v){
  if(v.roas === null) return '';
  const body = t('view.topLine', { r: fmtRatio(v.roas) });
  return '<p class="hint" style="margin-top:10px;line-height:1.5">' + esc(body) + '</p>';
}

function svgFunnelCompare(set, normalized){
  const stageIds = CONFIG.FUNNEL_STAGES.concat(['s6_contracted_plans']);
  const W = 940, labelW = 200, barMax = 520, barH = 15, gapIn = 4, gapOut = 22;
  const groupH = set.length * (barH + gapIn) + gapOut;
  const H = stageIds.length * groupH + 12;
  let max = 0;
  set.forEach(function(x){
    x.c.funnel.forEach(function(r){
      const val = normalized ? (x.c.funnel[0].value ? r.value / x.c.funnel[0].value : 0) : r.value;
      if(val > max) max = val;
    });
  });
  if(!max) max = 1;
  let s = svgOpen(W, H);
  stageIds.forEach(function(sid, i){
    const gy = 6 + i * groupH;
    s += txt(labelW - 10, gy + 14, (i + 1) + '. ' + L(VAR_BY_ID[sid].label), { anchor:'end', fill:C.text, size:11.5, weight:600 });
    set.forEach(function(x, k){
      const r = x.c.funnel[i];
      const raw = normalized ? (x.c.funnel[0].value ? r.value / x.c.funnel[0].value : 0) : r.value;
      const w = (raw / max) * barMax;
      const y = gy + k * (barH + gapIn);
      s += rect(labelW, y, w, barH, x.color, 2);
      s += txt(labelW + Math.max(w, 2) + 7, y + 12, normalized ? fmtPct(raw, 2) : fmtNum(raw, 0), { fill:C.text2, size:10 });
    });
  });
  s += '</svg>';
  return s;
}

/* ---- grouped bars -------------------------------------------------------- */
function svgGroupedBars(set){
  const metrics = [
    { id:'total_investment',        get:function(c){ return c.totalInvestment; } },
    { id:'total_gross_revenue_ltv', get:function(c){ return c.vars.total_gross_revenue_ltv; } },
    { id:'roi_revenue_abs',         get:function(c){ return c.vars.roi_revenue_abs; } }
  ];
  const W = 940, H = 330, padL = 78, padR = 16, padT = 24, padB = 66;
  const groupW = (W - padL - padR) / metrics.length;
  let maxV = 0, minV = 0;
  metrics.forEach(function(m){
    set.forEach(function(x){
      const v = m.get(x.c);
      if(v === null || !isFinite(v)) return;
      if(v > maxV) maxV = v;
      if(v < minV) minV = v;
    });
  });
  if(maxV === minV){ maxV = maxV || 1; }
  const span = (maxV - minV) || 1;
  const Y = function(v){ return padT + (maxV - v) / span * (H - padT - padB); };
  let s = svgOpen(W, H);
  for(let g = 0; g <= 4; g++){
    const val = minV + span * g / 4, y = Y(val);
    s += line(padL - 8, y, W - padR, y, C.grid, '2 4');
    s += txt(padL - 12, y + 3, fmtMoney(val, 0), { anchor:'end', fill:C.dim, size:9.5 });
  }
  s += line(padL - 8, Y(0), W - padR, Y(0), C.text2);
  metrics.forEach(function(m, i){
    const gx = padL + i * groupW;
    const bw = (groupW * 0.72) / set.length;
    set.forEach(function(x, k){
      const v = m.get(x.c);
      if(v === null || !isFinite(v)) return;
      const bx = gx + groupW * 0.14 + k * bw;
      const top = Math.min(Y(0), Y(v)), h = Math.abs(Y(v) - Y(0));
      s += rect(bx, top, bw - 3, Math.max(1, h), v < 0 ? C.neg : x.color, 2);
    });
    wrapLabel(L(VAR_BY_ID[m.id].label), 0, 0, 16).forEach(function(l, k){
      s += txt(gx + groupW / 2, H - padB + 20 + k * 12, l, { anchor:'middle', fill:C.text2, size:10 });
    });
  });
  s += '</svg>';
  return s;
}

/* ---- comparison text ----------------------------------------------------- */
function comparisonText(set, base){
  const nl = '\n';
  let s = t('tab.compare') + nl + t('cmp.baselineIs', { n: base.scn.name }) + nl + nl;
  s += 'KPI\t' + set.map(function(x){ return x.scn.name; }).join('\t') + nl;
  CMP_KPIS.forEach(function(k){
    s += L(VAR_BY_ID[k.id].label) + '\t' + set.map(function(x){ return fmtBy(k.fmt, k.get(x.c)); }).join('\t') + nl;
  });
  const winner = set.slice().sort(function(a, b){
    const av = a.c.vars.roi_revenue_pct, bv = b.c.vars.roi_revenue_pct;
    return (bv === null ? -Infinity : bv) - (av === null ? -Infinity : av);
  })[0];
  s += nl + t('cmp.winner') + ': ' + winnerSentence(winner, base) + nl;
  return s;
}

function bindCompare(){
  const root = $('#tab-compare');
  const bl = $('#cmp-baseline');
  if(bl) bl.addEventListener('change', function(e){ STATE.comparison.baselineId = e.target.value; saveState(); renderCompare(); });
  if(root._bound) return;
  root._bound = true;
  root.addEventListener('click', function(e){
    const chip = e.target.closest('[data-cmp-toggle]');
    if(chip){
      const id = chip.getAttribute('data-cmp-toggle');
      const ids = STATE.comparison.ids.slice();
      const i = ids.indexOf(id);
      if(i >= 0){ ids.splice(i, 1); }
      else if(ids.length < CONFIG.MAX_COMPARE){ ids.push(id); }
      else { ids[CONFIG.MAX_COMPARE - 1] = id; }
      STATE.comparison.ids = ids;
      if(ids.indexOf(STATE.comparison.baselineId) < 0) STATE.comparison.baselineId = ids[0] || null;
      saveState(); renderCompare(); return;
    }
    if(e.target.id === 'cmp-norm'){
      STATE.comparison.normalized = !STATE.comparison.normalized; saveState(); renderCompare(); return;
    }
    if(e.target.id === 'cmp-print'){ window.print(); return; }
    if(e.target.id === 'cmp-png'){ exportPNG($('#cmp-capture'), 'boost-comparison'); return; }
    if(e.target.id === 'cmp-copy'){
      const ids = cmpSelected();
      const set = ids.map(function(id, i){ const s = scenarioById(id); return { scn:s, c:calc(s), color:CONFIG.SCENARIO_COLORS[i], idx:i }; });
      const base = set[Math.max(0, ids.indexOf(STATE.comparison.baselineId))];
      copyText(comparisonText(set, base));
      return;
    }
  });
}
/* ============================================================================

   ========================================================================== */
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

function exportJSON(){
  const payload = {
    app: 'boost_roi_calc',
    version: CONFIG.SCHEMA_VERSION,
    exportedAt: nowISO(),
    lang: STATE.lang,
    settings: STATE.settings,
    formulas: STATE.formulas,
    scenarios: STATE.scenarios,
    comparison: STATE.comparison,
    changelog: STATE.changelog
  };
  downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' }),
    'boost-roi-scenarios-' + new Date().toISOString().slice(0, 10) + '.json');
  toast(t('io.exported'));
}

function importJSON(text){
  let data;
  try { data = JSON.parse(text); }
  catch(e){ toast(t('io.badSchema', { r: t('io.badJson') }), true); return; }
  if(!data || typeof data !== 'object'){ toast(t('io.badSchema', { r: t('io.badJson') }), true); return; }
  if(data.version !== undefined && Number(data.version) > CONFIG.SCHEMA_VERSION){
    toast(t('io.badSchema', { r: t('io.wrongVersion', { v: data.version }) }), true); return;
  }
  if(!Array.isArray(data.scenarios) || !data.scenarios.length){
    toast(t('io.badSchema', { r: t('io.noScenarios') }), true); return;
  }
  const incoming = data.scenarios.map(normalizeScenario);
  openModal(t('hdr.importJson'), '<p>' + esc(t('io.importMode')) + '</p>', [
    { label:t('common.cancel'), cls:'btn ghost', act:'close' },
    { label:t('io.merge'), cls:'btn secondary', act:'yes', fn:function(){
        incoming.forEach(function(s){
          s.id = uid('scn');
          s.name = uniqueName(s.name).name;
          STATE.scenarios.push(s);
        });
        finishImport(incoming.length);
    }},
    { label:t('io.replace'), cls:'btn', act:'yes', fn:function(){
        STATE.scenarios = incoming;
        STATE.activeScenarioId = incoming[0].id;
        STATE.comparison = { ids: incoming.slice(0, CONFIG.MAX_COMPARE).map(function(s){ return s.id; }),
                             baselineId: incoming[0].id, normalized: false };
        if(data.formulas){
          const merged = {};
          FORMULA_DEFS.forEach(function(d){
            const st = data.formulas[d.id];
            merged[d.id] = (st && Array.isArray(st.tokens) && FormulaEngine.validate(st.tokens).ok)
              ? { tokens: st.tokens, modified: !!st.modified }
              : { tokens: FormulaEngine.clone(d.tokens), modified: false };
          });
          const res = FormulaEngine.resolveOrder((function(){ const o = {}; Object.keys(merged).forEach(function(k){ o[k] = merged[k].tokens; }); return o; })());
          if(res.order) STATE.formulas = merged;
        }
        if(data.settings) STATE.settings = Object.assign({}, STATE.settings, data.settings);
        if(Array.isArray(data.changelog)) STATE.changelog = data.changelog.slice(0, CONFIG.CHANGELOG_MAX);
        finishImport(incoming.length);
    }}
  ]);
}

function finishImport(n){
  DRAFT = null; DIRTY = false; FORMULA_DRAFT = null; FORMULA_DIRTY = false;
  rebuildEvalOrder(STATE.formulas);
  invalidateCalc(); saveState(); closeModal(); renderAll();
  toast(t('io.imported', { n: n }));
}

/* ============================================================================
   PNG EXPORT — clone the section, embed the stylesheet inside an SVG
   foreignObject, rasterise on a canvas. No external libraries.
   ========================================================================== */
function exportPNG(el, filename){
  if(!el){ toast(t('view.pngFail'), true); return; }
  try {
    const w = Math.max(360, Math.ceil(el.getBoundingClientRect().width));
    const h = Math.max(200, Math.ceil(el.scrollHeight) + 24);
    const css = Array.prototype.map.call(document.querySelectorAll('style'), function(s){ return s.textContent; }).join('\n');
    const clone = el.cloneNode(true);
    clone.querySelectorAll && Array.prototype.forEach.call(clone.querySelectorAll('.no-print'), function(n){ n.parentNode.removeChild(n); });
    const inner = '<div xmlns="http://www.w3.org/1999/xhtml" class="png-root" style="width:' + w + 'px;padding:12px;background:#111111">' +
      clone.outerHTML + '</div>';
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
      '<style>' + css + '</style><foreignObject x="0" y="0" width="' + w + '" height="' + h + '">' + inner + '</foreignObject></svg>';
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    const img = new Image();
    img.onload = function(){
      try {
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = w * scale; canvas.height = h * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#111111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(function(b){
          if(!b){ toast(t('view.pngFail'), true); return; }
          downloadBlob(b, filename + '.png');
          toast(t('view.pngDone'));
        }, 'image/png');
      } catch(err){ toast(t('view.pngFail'), true); }
    };
    img.onerror = function(){ toast(t('view.pngFail'), true); };
    img.src = url;
  } catch(e){ toast(t('view.pngFail'), true); }
}

/* ============================================================================
   EVENTS — global
   ========================================================================== */
function bindGlobal(){
  /* Preset editors and the conversion lens live on more than one tab, so they
     are delegated once at document level instead of per-tab. */
  document.addEventListener('click', function(e){
    const pe = e.target.closest && e.target.closest('[data-preset-edit]');
    if(pe){ const k = pe.getAttribute('data-preset-edit'); PRESET_EDIT[k] = !PRESET_EDIT[k]; renderAll(); return; }
    const ps = e.target.closest && e.target.closest('[data-preset-save]');
    if(ps){ savePresets(ps.getAttribute('data-preset-save')); return; }
    const px = e.target.closest && e.target.closest('[data-preset-reset]');
    if(px){ resetPresets(px.getAttribute('data-preset-reset')); return; }
    const pl = e.target.closest && e.target.closest('[data-lens]');
    if(pl){ setLens(pl.getAttribute('data-lens')); return; }
  });
  document.addEventListener('change', function(e){
    const px = e.target.closest && e.target.closest('[data-ptax]');
    if(px){
      const code = px.getAttribute('data-ptax');
      STATE.settings.fxRates[code] = Math.max(0.0001, parseLoose(px.value));
      saveState(); renderAll();
    }
  });

  $$('.tab-btn').forEach(function(b){
    b.addEventListener('click', function(){ switchTab(b.getAttribute('data-tab')); });
  });

  /* Delegated: the picker is re-rendered with the Builder tab. Switching what
     you edit must not silently change what Scenario View displays — that tab
     keeps its own selection. */
  document.addEventListener('change', function(e){
    const el = e.target;
    if(!el || el.id !== 'builder-scenario') return;
    const target = el.value;
    const go = function(){
      STATE.activeScenarioId = target;
      DRAFT = null; DIRTY = false;
      saveState(); renderAll();
    };
    if(DIRTY){
      el.value = STATE.activeScenarioId;   // revert until confirmed
      confirmDialog(t('builder.discard'), function(){ closeModal(); go(); });
    } else go();
  });

  $('#hdr-lang').addEventListener('change', function(e){
    STATE.lang = e.target.value; saveState(); renderAll();
  });

  $('#hdr-currency').addEventListener('change', function(e){
    STATE.settings.currency = e.target.value; saveState(); renderAll();
  });

  $('#btn-export-json').addEventListener('click', exportJSON);
  $('#btn-import-json').addEventListener('click', function(){ $('#file-input').click(); });
  $('#file-input').addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = function(){ importJSON(String(rd.result)); };
    rd.onerror = function(){ toast(t('io.badSchema', { r: t('io.badJson') }), true); };
    rd.readAsText(f);
    e.target.value = '';
  });

  $('#btn-methodology').addEventListener('click', function(){
    openModal(t('meth.title'), METHODOLOGY[STATE.lang] || METHODOLOGY.en,
      [{ label:t('meth.close'), cls:'btn', act:'close' }]);
  });

  $('#modal-root').addEventListener('click', function(e){
    const btn = e.target.closest('[data-modal-act]');
    if(btn){
      const act = btn.getAttribute('data-modal-act');
      if(act === 'close'){ closeModal(); return; }
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const conf = $('#modal-root')._buttons && $('#modal-root')._buttons[idx];
      if(conf && typeof conf.fn === 'function'){ conf.fn(); }
      else closeModal();
      return;
    }
    if(e.target.hasAttribute && e.target.hasAttribute('data-modal-backdrop')) closeModal();
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && $('#modal-root').innerHTML) closeModal();
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
      e.preventDefault();
      if(STATE.activeTab === 'builder' && DIRTY) saveScenario(false);
      else if(STATE.activeTab === 'formulas' && FORMULA_DIRTY) saveFormulas();
    }
  });
}

/* ============================================================================
   INIT
   ========================================================================== */
function init(){
  try { localStorage.setItem('__boost_probe', '1'); localStorage.removeItem('__boost_probe'); }
  catch(e){ STORAGE_OK = false; }

  STATE = loadState();
  if(!STATE.viewScenarioId) STATE.viewScenarioId = STATE.activeScenarioId;

  const res = rebuildEvalOrder(STATE.formulas);
  if(!res.order){
    // A corrupted or circular stored formula set cannot run: fall back to defaults.
    STATE.formulas = defaultFormulas();
    rebuildEvalOrder(STATE.formulas);
  }

  bindGlobal();
  renderAll();
  // Persist immediately after a schema upgrade so the migration is durable
  // even if the session ends without an explicit save.
  if(MIGRATED) saveState();
  if(!STORAGE_OK) toast(t('err.storage'), true);

  // Self-check against the seed figures from the source workbook.
  if(window.location.hash === '#selftest') runSelfTest();
}

function runSelfTest(){
  const out = [];
  const s1 = STATE.scenarios[0], s2 = STATE.scenarios[1];
  const c1 = computeScenario(s1), c2 = computeScenario(s2);
  const check = function(label, actual, expected, tol){
    const ok = actual !== null && Math.abs(actual - expected) <= tol;
    out.push((ok ? 'PASS' : 'FAIL') + '  ' + label + ' \u2014 got ' + actual + ', expected ' + expected);
  };
  check('S1 contracted plans', c1.vars.s6_contracted_plans, 158, 0.5);
  check('S1 gross revenue LTV', c1.vars.total_gross_revenue_ltv, 139040, 1);
  check('S1 ROI revenue absolute', c1.vars.roi_revenue_abs, -1920, 1);
  check('S1 ROI revenue %', c1.vars.roi_revenue_pct, -0.01362088536, 0.00001);
  check('S1 end-to-end', c1.vars.end_to_end_conversion, 158 / 6706, 0.0001);
  check('S2 contracted plans', c2.vars.s6_contracted_plans, 132, 0.5);
  check('S2 gross revenue LTV', c2.vars.total_gross_revenue_ltv, 116160, 1);
  check('S2 ROI revenue absolute', c2.vars.roi_revenue_abs, 75760, 1);
  check('S2 ROI revenue %', c2.vars.roi_revenue_pct, 1.875247525, 0.00001);

if(EMBED){
  document.documentElement.classList.add('embed');
  window.addEventListener('message', function(e){
    if(e.source !== window.parent || !e.data || typeof e.data !== 'object') return;
    if(e.data.type === 'roi:init') embedInit(e.data);
  });
  const ready = function(){ embedPost({ type:'roi:ready' }); };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready); else ready();
} else {
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
}
